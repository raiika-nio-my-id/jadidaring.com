<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- ================= EDITABLE CONTENT: texts, styles (hair targets), customers, tutorial and colours live in this JSON only ================= -->
<script type="application/json" id="website-config">
/*CONFIG*/
</script>
<!-- ================= END OF EDITABLE CONTENT ================= -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cukur Kekinian · Game Barbershop Potong Rambut Sesuai Foto</title>
<meta name="description" content="Cukur Kekinian: game barbershop solo. Pelanggan bawa foto gaya rambut (two-block, mullet, curtain, fade, mohawk, botak licin), kamu cukur pakai gunting dan clipper, lalu dinilai bintang dari seberapa mirip fotonya. Gratis, cocok untuk HP.">
<meta name="theme-color" content="#1d3f4e">
<meta property="og:type" content="website">
<meta property="og:title" content="Cukur Kekinian">
<meta property="og:description" content="Pelanggan bawa foto gaya rambut. Gunting, clipper, jadi kece!">
<style>
/*CSS*/
</style>
</head>
<body>
/*SNIPPETS*/
<canvas id="cv" aria-label="Barbershop: kepala pelanggan dan rambut yang bisa dipotong"></canvas>

<!-- home -->
<main id="home" class="screen">
  <div class="home-card">
    <div class="pole" aria-hidden="true"><i></i></div>
    <div class="logo" aria-hidden="true"><span class="l1">CUKUR</span><span class="l2">KEKINIAN</span><span class="snip">✂️</span></div>
    <h1 class="sr-only" data-c="site.name"></h1>
    <p class="tagline" data-c="site.tagline"></p>
    <label class="name-field"><span data-t="nameLabel"></span>
      <input id="nameIn" data-jd-account-name type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="JadiDaring">
      <small data-t="nameHint"></small>
    </label>
    <button type="button" class="btn big primary" id="playBtn"><span class="ic" aria-hidden="true">💈</span><span data-t="play"></span></button>
    <div class="row2">
      <button type="button" class="btn" id="tutBtn"><span aria-hidden="true">🎓</span> <span data-t="how"></span></button>
      <button type="button" class="btn" id="recBtn"><span aria-hidden="true">🏆</span> <span data-t="records"></span></button>
      <button type="button" class="btn sq" id="homeMute" data-t-aria="mute">🔊</button>
    </div>
    <div class="stat-strip" id="statStrip"></div>
  </div>
  <footer class="site-footer">
    <p><strong data-c="site.name"></strong> · <span data-t="footerNote"></span></p>
    <nav aria-label="Tautan"><a href="https://gamehub.jadidaring.com/">Game Hub</a> &middot; <a href="/syarat-ketentuan">Syarat &amp; Ketentuan</a></nav>
  </footer>
</main>

<!-- records -->
<div class="overlay" id="recDlg" role="dialog" aria-modal="true" aria-labelledby="recTitle" hidden>
  <div class="dlg">
    <h2 id="recTitle" data-t="recTitle"></h2>
    <div class="stat-grid" id="recGrid"></div>
    <ul class="how-list small"><li data-t="tips1"></li><li data-t="tips2"></li><li data-t="tips3"></li></ul>
    <button type="button" class="btn big primary" id="recClose" data-t="close"></button>
  </div>
</div>

<!-- play HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <button type="button" class="ic-btn" id="pauseBtn" data-t-aria="pause">❚❚</button>
    <div class="plate">
      <div class="plate-row"><span class="who" id="whoName"></span><span class="cnum" id="custNum"></span></div>
      <div class="patience" id="patience"><i id="patBar"></i><span id="patNum"></span></div>
    </div>
    <button type="button" class="ic-btn" id="muteBtn" data-t-aria="mute">🔊</button>
  </div>
  <div class="row-info">
    <figure class="photo" id="photo"><canvas id="cardCv" width="180" height="200"></canvas><figcaption><b id="styleName"></b><small id="styleDesc"></small></figcaption><span class="tape" aria-hidden="true"></span></figure>
    <div class="meter"><span class="mlbl"><span data-t="match"></span> <b id="matchNum">0%</b></span><div class="bar"><i id="matchBar"></i><em class="tick" id="tk1"></em><em class="tick" id="tk2"></em><em class="tick" id="tk3"></em><em class="tick" id="tk4"></em></div><div class="mstars" id="mStars">★</div></div>
  </div>
  <div class="bubble" id="bubble" hidden></div>
  <div class="coach" id="coach" hidden><b id="coachTxt"></b><small id="coachSub"></small><div class="coach-btns"><button type="button" class="cbtn ok" id="coachOk" data-t="ok"></button><button type="button" class="cbtn" id="skipTut" data-t="skip"></button></div></div>
  <div class="banner" id="banner" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <span class="demo-tag" id="demoTag" data-t="demo" hidden></span>
  <div class="hud-bot">
    <div class="guards" id="guards"></div>
    <div class="tools">
      <button type="button" class="tool" id="toolScissors" data-tool="scissors"><span class="ti" aria-hidden="true">✂️</span><small data-t="scissors"></small></button>
      <button type="button" class="tool" id="toolClipper" data-tool="clipper"><span class="ti" aria-hidden="true">🪒</span><small data-t="clipper"></small></button>
      <button type="button" class="tool done" id="finishBtn"><span class="ti" aria-hidden="true">✅</span><small data-t="finish"></small></button>
    </div>
  </div>
</div>

<!-- pause -->
<div class="overlay" id="pauseDlg" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
  <div class="dlg">
    <h2 id="pauseTitle" data-t="pausedTitle"></h2>
    <p class="muted" data-t="pausedSub"></p>
    <button type="button" class="btn big primary" id="resumeBtn" data-t="resume"></button>
    <button type="button" class="btn" id="quitBtn" data-t="menu"></button>
  </div>
</div>

<!-- per-customer result -->
<div class="overlay res" id="resDlg" role="dialog" aria-modal="true" aria-labelledby="resTitle" hidden>
  <div class="dlg">
    <div class="react" id="resEmoji" aria-hidden="true"></div>
    <h2 id="resTitle"></h2>
    <p class="quote" id="resQuote"></p>
    <div class="stars" id="resStars" aria-label=""></div>
    <div class="stat-grid three">
      <div><small data-t="resultMatch"></small><b id="rPct"></b></div>
      <div><small data-t="resultTip"></small><b id="rTip"></b></div>
      <div><small data-t="resultTime"></small><b id="rLeft"></b></div>
    </div>
    <button type="button" class="btn big primary" id="nextBtn"></button>
  </div>
</div>

<!-- tutorial done -->
<div class="overlay" id="tutDlg" role="dialog" aria-modal="true" aria-labelledby="tutTitle" hidden>
  <div class="dlg">
    <div class="big-ic" aria-hidden="true">💈✂️</div>
    <h2 id="tutTitle" data-t="tutDone"></h2>
    <p class="muted" data-t="tutDoneSub"></p>
    <ul class="how-list small"><li data-t="tips1"></li><li data-t="tips2"></li><li data-t="tips3"></li></ul>
    <button type="button" class="btn big primary" id="tutStart" data-t="tutStart"></button>
  </div>
</div>

<!-- end of shift -->
<div class="overlay over" id="endDlg" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
  <div class="dlg">
    <h2 id="endTitle" class="over-title" data-t="endTitle"></h2>
    <p class="muted" id="endSub"></p>
    <p class="best-badge" id="bestBadge" data-t="endBest" hidden></p>
    <div class="cust-list" id="custList"></div>
    <div class="stat-grid three">
      <div><small data-t="endStars"></small><b id="eStars"></b></div>
      <div><small data-t="endTips"></small><b id="eTips"></b></div>
      <div><small data-t="endPerfect"></small><b id="ePerf"></b></div>
    </div>
    <button type="button" class="btn big primary" id="againBtn" data-t="again"></button>
    <button type="button" class="btn" id="menuBtn" data-t="menu"></button>
  </div>
</div>

<script id="ck-sim">
/*SIM*/
</script>
<script id="ck-render">
/*RENDER*/
</script>
<script id="ck-app">
/*APP*/
</script>
</body>
</html>
