<style>
:root{--ink:#22171a;--cream:#fff6e8;--wood:#8a5530;--wood2:#5e3319;--pink:#ff4fa3;--cyan:#3df5ff;--gold:#ffd23f;--red:#e2343a;--blue:#2a5fd8;--teal:#1d3f4e;--card:rgba(255,246,232,.97);--shadow:0 6px 0 rgba(40,18,8,.45),0 16px 34px rgba(0,0,0,.4);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

html,body{margin:0;height:100%;background:#10252f;color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;touch-action:manipulation}

.btn.primary:active{box-shadow:0 2px 0 #7d1022}

.btn.sq{width:56px;flex:0 0 56px;font-size:20px;padding:0}

.pole{display:none}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;line-height:.86;margin-top:4px;transform:rotate(-3deg)}

.logo .l1{font-size:clamp(46px,14vw,66px);color:var(--red)}

.how-list.small{font-size:13px}
.big-ic{font-size:44px;animation:bob 2s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-6px)}}
.overlay.res{background:radial-gradient(circle at 50% 30%,rgba(255,79,163,.25),rgba(8,18,24,.6))}
.react{font-size:64px;line-height:1;margin-top:-4px;animation:wob 1s ease-in-out infinite}

.quote{margin:-4px 0 0;font-weight:800;font-size:17px;color:#5a2a18;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:inset 0 0 0 2px #f1d6bb;position:relative}
.stars{display:flex;gap:4px;font-size:38px;line-height:1}

.best-badge{margin:0;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,#ffe07a,#ffb627);font-weight:900;animation:bob 1.4s ease-in-out infinite}

.photo small{display:none}
.photo .tape{position:absolute;left:30px;top:-8px;width:34px;height:14px;background:rgba(255,224,102,.75);transform:rotate(6deg)}
.photo.pop{animation:card-in .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes card-in{from{transform:rotate(-30deg) translate(-40px,-30px) scale(.5);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.meter{flex:1;min-width:0;background:rgba(10,20,26,.72);border:2px solid rgba(61,245,255,.45);border-radius:14px;padding:6px 10px 7px;color:#eafcff;box-shadow:0 0 14px rgba(61,245,255,.18)}
.mlbl{font-size:12px;font-weight:800;display:flex;justify-content:space-between}
.mlbl b{font-size:16px;font-weight:1000;color:var(--cyan);font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:4px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold),#7cf29a);transition:width .25s}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.7);border-radius:2px}
.mstars{margin-top:4px;font-size:15px;letter-spacing:1px;color:var(--gold);font-weight:900;min-height:18px;text-shadow:0 1px 0 #5a3a00}
.mstars .dim{color:rgba(255,255,255,.25);text-shadow:none}
.bubble{position:absolute;z-index:2;max-width:min(240px,62vw);background:#fff;color:#3a1a10;font-weight:900;font-size:15px;padding:9px 13px;border-radius:18px;box-shadow:0 5px 0 rgba(40,18,8,.35);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.bubble::after{content:"";position:absolute;left:18px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.ouch{background:#ffe1e1;color:#a0101c}
.bubble.ouch::after{border-top-color:#ffe1e1}
.coach{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 156px);transform:translateX(-50%);width:min(360px,calc(100% - 20px));display:flex;flex-direction:column;gap:3px;background:rgba(255,246,232,.98);border:3px solid var(--gold);border-radius:18px;padding:10px 12px;box-shadow:0 6px 0 rgba(40,18,8,.4);text-align:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.coach b{font-size:15px;line-height:1.3}
.coach small{font-size:12px;font-weight:700;color:#7a5a44}
.coach-btns{display:flex;gap:8px;justify-content:center;margin-top:4px}
.cbtn{border:0;border-radius:12px;min-height:38px;padding:4px 14px;font-weight:900;font-size:14px;background:#efe1d2;color:#5a3a24}
.cbtn.ok{background:linear-gradient(180deg,#ff6b8b,#e2343a);color:#fff;box-shadow:0 3px 0 #7d1022}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(22px,7vw,34px);color:#fff;-webkit-text-stroke:2px #2a0f14;paint-order:stroke fill;text-shadow:0 4px 0 #2a0f14,0 0 22px rgba(255,79,163,.8);white-space:nowrap;animation:banner 2.4s ease forwards}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{transform:translate(-50%,-50%) scale(1.1);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.toasts{position:absolute;left:0;right:0;top:42%;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:rgba(20,12,10,.85);color:#fff;font-weight:900;font-size:15px;padding:7px 14px;border-radius:999px;animation:toast 1.5s ease forwards}
.toast.bad{background:rgba(190,20,40,.92)}
.toast.good{background:rgba(20,140,80,.92)}
@keyframes toast{0%{transform:translateY(10px) scale(.8);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.demo-tag{position:absolute;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 150px);background:var(--pink);color:#fff;font-weight:1000;font-size:12px;padding:3px 9px;border-radius:999px;letter-spacing:1px}
.hud-bot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px max(10px,env(safe-area-inset-bottom));pointer-events:none}
.hud-bot>*{pointer-events:auto}
.guards{display:flex;gap:6px;background:rgba(10,20,26,.75);padding:5px;border-radius:16px;border:2px solid rgba(255,255,255,.15);transition:opacity .2s,transform .2s}
.guards.off{opacity:0;transform:translateY(10px);pointer-events:none}
.guard{min-width:58px;min-height:42px;border:0;border-radius:12px;background:#33434e;color:#dfe9ef;font-weight:1000;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.guard small{font-size:10px;font-weight:700;opacity:.8;margin-top:2px}
.guard.on{background:linear-gradient(180deg,#fff0a0,var(--gold));color:#3a2400;box-shadow:0 3px 0 #8a5a00}
.tools{display:flex;gap:8px;width:min(420px,100%);background:linear-gradient(180deg,#a8683a,#6b3a1a);border:2px solid #c98a52;border-radius:22px;padding:7px;box-shadow:0 6px 0 rgba(30,12,4,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.tool{flex:1;min-height:68px;border:0;border-radius:16px;background:linear-gradient(180deg,#f4f7f9,#b8c4cb);color:#22303a;box-shadow:0 4px 0 #5b6770;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900}
.tool .ti{font-size:28px;line-height:1}
.tool small{font-size:13px;font-weight:900}
.tool.on{background:linear-gradient(180deg,#9ffcff,var(--cyan));box-shadow:0 4px 0 #0f7f86,0 0 18px rgba(61,245,255,.7);transform:translateY(-2px)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #5b6770}
.tool.done{background:linear-gradient(180deg,#9ff5b6,#2fbf6a);color:#063a1c;box-shadow:0 4px 0 #156b37}
.pulse{animation:pulse 1s ease-in-out infinite!important}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,63,.85),0 0 24px rgba(255,210,63,.9);transform:translateY(-3px) scale(1.04)}}
@media (min-width:700px){.photo{width:132px}.photo canvas{width:122px;height:135px}.photo b{font-size:14px}.photo small{display:block;font-size:10px;color:#7a5a44;text-align:center;margin-top:2px}.meter{max-width:360px;margin-left:auto}.hud-top .plate{max-width:520px;margin:0 auto}}
@media (max-height:620px){.tool{min-height:56px}.tool .ti{font-size:22px}.guard{min-height:36px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
#rTip,#eTips{white-space:nowrap;font-size:clamp(15px,4.4vw,22px)}
</style>
</head>

<script id="ck-sim">
// Cukur Kekinian - pure rules: head + hair strands, style targets, scissors/clipper cuts, scoring, shift, records. No DOM.
(function (G) {
  'use strict';
  var U = 0.25, RX = 0.86, RY = 1.0, BRUSH = 0.22, CLIP_RATE = 9, SNIP_MIN = 0.15, HEAD_PAD = 1.035;

  }

  var ANG = [];

  [105, 111, 117, 123, 129, 135].forEach(function (n) { ANG.unshift(-n); ANG.push(n); });
  ANG.sort(function (x, y) { return x - y; });
  function zone(th) { var a = Math.abs(th); return a > 102 ? 'nape' : a <= 42 ? 'top' : 'side'; }
  function target(st, th) {
    var a = Math.abs(th); if (a > 102) return st.nape;
    var tw = st.topW == null ? 45 : st.topW, bl = st.blend || 10, side = st.side;
    if (st.fade != null) { var f = clamp((100 - a) / Math.max(1, 100 - (tw + bl)), 0, 1); side = st.fade + (st.side - st.fade) * f; }
    if (a <= tw) return st.top;
    if (a >= tw + bl) return side;
    var k = (a - tw) / bl; k = k * k * (3 - 2 * k); return st.top + (side - st.top) * k;
  }
  function root(th) { var r = th * Math.PI / 180; return { x: RX * Math.sin(r), y: -RY * Math.cos(r) }; }
  function inHead(x, y, pad) { var u = x / RX, v = y / RY; return u * u + v * v < pad * pad; }
  // polyline of a strand in head units (head radius ~1). Returns {pts:[x0,y0,x1,y1...], step: cm per segment}
  function path(sd, L, part) {
    L = L == null ? sd.L : L; var r0 = root(sd.th), x = r0.x, y = r0.y, nx = x / (RX * RX), ny = y / (RY * RY), d = Math.hypot(nx, ny); nx /= d; ny /= d;
    var pts = [x, y]; if (L <= 0.001) return { pts: pts, step: 0 };
    var n = Math.max(1, Math.ceil(L / 0.25)), c = L / n, side = sd.th > 0 ? 1 : sd.th < 0 ? -1 : (sd.i % 2 ? 1 : -1), a = Math.abs(sd.th);
    var push = a < 30 ? (part ? 0.9 : 0.35) * (1 - a / 30) : 0, dx = nx, dy = ny, s = 0;
    for (var k = 0; k < n; k++) {
      s += c; dy += (0.16 + 0.11 * s) * c; dx += side * push * c; if (a > 102) dy += 0.35 * c;
      d = Math.hypot(dx, dy); dx /= d; dy /= d; x += dx * c * U; y += dy * c * U;

    }

  }
  function segX(ax, ay, bx, by, cx, cy, dx, dy) { // intersection of AB and CD -> t on CD or -1
    var rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return -1;
    var qx = cx - ax, qy = cy - ay, t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? u : -1;
  }
  function styleById(cfg, id) { for (var i = 0; i < cfg.styles.length; i++) if (cfg.styles[i].id === id) return cfg.styles[i]; return cfg.styles[0]; }
  function create(o) {
    var cfg = o.cfg, st = typeof o.style === 'string' ? styleById(cfg, o.style) : o.style, r = rng(o.seed || 'x');
    var S = { cfg: cfg, style: st, seed: o.seed, strands: [], time: 0, limit: o.limit == null ? cfg.game.patience : o.limit, done: false, ev: [], snips: 0, clipT: 0, overs: 0, guard: 1, tool: 'scissors' };
