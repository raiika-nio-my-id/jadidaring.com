:root{--bg:#1d0806;--bg2:#2a0d0b;--red:#7a1a12;--wood:#6b3b1f;--wood2:#8a5a2b;--gold:#ffc845;--gold2:#e0a53b;--cream:#fff3d6;--muted:#d9bf9a;--l0:#ffc845;--l1:#ef5a3c;--l2:#3cc7b4;--card:rgba(255,236,200,.06);--line:rgba(255,210,140,.18);--r:16px;

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) var(--kawung);color:var(--cream);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5em;letter-spacing:.2px}
h2{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--gold)}
a{color:var(--gold)}
.wrap{width:min(1120px,100% - 32px);margin:0 auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#2a0d0b;padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:2px solid transparent;font:700 1rem/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;text-decoration:none;transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.pad:focus-visible,.icon-btn:focus-visible,.song:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#e0a53b);color:#3a1206;box-shadow:0 4px 0 #8a5a12,0 8px 20px rgba(255,200,69,.25)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(255,236,200,.06);border-color:var(--line);color:var(--cream)}
.btn.big{min-height:54px;padding:12px 26px;font-size:1.08rem}
.small-btn{min-height:38px;padding:6px 14px;font-size:.9rem}
.site-header{position:sticky;top:0;z-index:20;background:rgba(29,8,6,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none;margin-right:auto}
.brand strong{display:block;font-family:Georgia,serif;font-size:1.15rem;color:var(--gold)}
.brand small{display:block;font-size:.75rem;color:var(--muted)}
.brand-mark{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffe9a6 0 18%,#c98a22 20% 36%,#ffc845 38% 52%,#8a5a12 54% 100%);box-shadow:0 0 0 2px #3a1206,0 0 14px rgba(255,200,69,.45)}
.site-nav{display:flex;gap:16px}
.site-nav a{color:var(--cream);text-decoration:none;font-weight:600;font-size:.95rem}
.site-nav a:hover{color:var(--gold)}
.mute-btn{min-height:38px;padding:6px 12px;font-size:.85rem}
@media (max-width:640px){.site-nav{display:none}}
.hero{padding:clamp(28px,6vw,72px) 0 40px;background:radial-gradient(ellipse at 70% 30%,rgba(255,200,69,.16),transparent 60%),linear-gradient(180deg,var(--red),var(--bg2) 70%,transparent)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(2.1rem,6.4vw,3.7rem);color:var(--cream);text-shadow:0 3px 0 #3a1206}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.lead{font-size:1.1rem;color:var(--muted);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.stats{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}
.stats li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px}
.stats b{display:block;font-size:1.35rem;color:var(--gold)}
.stats span{font-size:.78rem;color:var(--muted)}
.hero-art{position:relative;aspect-ratio:1/1;max-width:420px;width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle,rgba(255,200,69,.18),transparent 65%)}
.gunungan{position:absolute;left:50%;top:4%;width:46%;height:62%;transform:translateX(-50%);background:linear-gradient(180deg,#e0a53b,#8a3a12);clip-path:polygon(50% 0,64% 18%,78% 40%,92% 72%,100% 100%,0 100%,8% 72%,22% 40%,36% 18%);opacity:.55;animation:sway 4s ease-in-out infinite}

.ha-bonang{left:6%;bottom:16%;width:40%;height:18%;display:flex;gap:6%;align-items:flex-end;padding:0 4%;border-bottom:8px solid var(--wood2);animation:bop 1.3s ease-in-out infinite}
.ha-bonang i,.inst.bonang i{flex:1;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff1b5 0 14%,#d99a26 16% 34%,#ffc845 36% 60%,#9a6414 62%)}
.ha-kendang{left:39%;bottom:8%;width:28%;height:20%;border-radius:40%/50%;background:linear-gradient(90deg,#f2d6a8 0 9%,#a8371f 10% 90%,#f2d6a8 91%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25);animation:bop 1.3s .43s ease-in-out infinite}
.ha-gong{right:4%;bottom:22%;width:36%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe39a 0 12%,#b07a1c 14% 22%,#3cc7b4 24% 30%,#9a6414 32% 70%,#5a3a0c 72%);animation:wob 2.6s ease-in-out infinite}
.ha-note{position:absolute;width:18px;height:18px;border-radius:50%;top:-4%;animation:fall 2.6s linear infinite;opacity:.9}
.ha-note.n1{left:20%;background:var(--l0)}.ha-note.n2{left:50%;background:var(--l1);animation-delay:.9s}.ha-note.n3{left:78%;background:var(--l2);animation-delay:1.7s}

  Game.prototype.hud = function (t) {

  };
  // ---------- tutorial (learn by playing) ----------
  Game.prototype.tutTick = function (t) {

    if (tu.done || !st) return;

  };
  Game.prototype.tutShow = function () {

  Game.prototype.tutWrong = function (lane) { var st = CFG.tutorial[this.tut.step]; if (st && st.lane >= 0 && lane !== st.lane) $('coachHint').textContent = t_('tutWrong'); };

    hw.confetti(90); shake(true);
  };

  // ---------- fx helpers ----------
  function padHit(lane) { var p = document.querySelector('.pad' + lane); p.classList.remove('hit' + lane); void p.offsetWidth; p.classList.add('hit' + lane); }
  function showJudge(j, dt) {

    el.className = 'judge ' + j; el.innerHTML = esc(t_(key)) + (j !== 'perfect' && dt != null && Math.abs(dt) > 5 ? '<small>' + esc(t_(dt < 0 ? 'early' : 'late')) + '</small>' : '');

    Snd.fanfare(g.song, n >= 50 ? 7 : 5);
  }

  // ---------- screens ----------

    var P = $('play'); P.hidden = false; $('pauseDlg').hidden = true; $('resDlg').hidden = true; $('coach').hidden = g.mode !== 'tutorial'; $('demoTag').hidden = g.mode !== 'demo';
