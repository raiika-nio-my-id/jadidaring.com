<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Malam Pendakian · Game Horor Co-op Mabar di HP Gratis (1–4 Pemain)</title>
<meta name="description" content="Malam Pendakian: game horor co-op yang bisa mabar di HP tanpa download. Mendaki gunung malam hari bareng 1–4 teman, berbagi baterai senter, sorot pocong dan kuntilanak, dan capai puncak sebelum kabut turun. Ada bot untuk main sendiri, chat, dan ping cepat.">
<meta name="theme-color" content="#070b16">
<meta property="og:type" content="website">
<meta property="og:title" content="Malam Pendakian · horor co-op gunung">
<meta property="og:description" content="Naik gunung tengah malam bareng teman. Senter terbatas, pocong mendekat, kabut turun. Gratis di browser HP.">
<style>
/*CSS*/
</style>
</head>
<body>
/*SNIPPETS*/
<main id="main" data-game="malamPendakian">
  <!-- ============ HOME ============ -->
  <div id="home" class="screen">
    <header class="top wrap">
      <span class="brand"><span class="logo" aria-hidden="true">🔦</span><span><strong data-c="title"></strong><small data-t="tagline"></small></span></span>
      <div class="topbtns">
        <button type="button" class="chip" id="muteBtn" aria-label="Suara"></button>
        <div class="langsw" role="group" aria-label="Bahasa / Language"><button type="button" class="lb" data-lang="id">ID</button><button type="button" class="lb" data-lang="en">EN</button></div>
      </div>
    </header>
    <section class="hero wrap">
      <div class="herobox"><canvas id="heroCv" aria-hidden="true"></canvas>
        <div class="herotext"><h1 class="title" aria-label="Malam Pendakian"><span class="t1">MALAM</span><span class="t2">PENDAKIAN</span></h1><p class="kick" data-t="kick"></p></div>
      </div>
      <p class="lead" data-t="lead"></p>
    </section>
    <section class="wrap grid">
      <article class="card">
        <h2 data-t="youTitle"></h2>
        <label class="field"><span data-t="name"></span><input type="text" id="nameInput" maxlength="24" autocomplete="off" placeholder="JadiDaring"></label>
        <h3 data-t="practiceTitle"></h3>
        <p class="muted small" data-t="practiceSub"></p>
        <div class="row"><span class="lbl" data-t="bots"></span><div class="seg" id="soloBots" role="radiogroup"><button type="button" data-v="0">0</button><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button></div></div>
        <p class="muted small" id="bestLine"></p>
        <div class="row wrapbtns"><button type="button" class="btn lamp big" id="practiceBtn" data-t="practiceGo"></button><button type="button" class="btn ghost" id="tutBtn" data-t="tutGo"></button></div>
      </article>
      <article class="card">
        <h2 data-t="onlineTitle"></h2>
        <p class="muted small" data-t="onlineSub"></p>
        <p class="note small" id="onlineNote" hidden></p>
        <div class="row wrapbtns"><button type="button" class="btn red online-btn" id="createPub" data-t="createPub"></button><button type="button" class="btn lamp online-btn" id="createPriv" data-t="createPriv"></button></div>
        <div class="row"><button type="button" class="btn ghost online-btn" id="matchBtn" data-t="match"></button></div>
        <form class="row joinrow" id="joinForm"><input type="text" id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" data-tp="codePh" aria-label="Kode room"><button type="submit" class="btn green online-btn" id="joinBtn" data-t="join"></button></form>
      </article>
      <article class="card howto">
        <h2 data-t="howTitle"></h2>
        <div id="howList" class="how"></div>
        <h3 class="ctl-h" data-t="helpKeysH"></h3>
        <div id="howCtl" class="howctl"></div>
      </article>
    </section>
    <section class="wrap"><div class="card gm-card" id="gmRooms" aria-labelledby="gmTitle" hidden>
      <div class="gm-top"><h2 id="gmTitle" data-t="gmTitle"></h2><button type="button" class="btn ghost small" id="gmRefresh" data-t="gmRefresh"></button></div>
      <p class="muted small" id="gmNote" role="status" aria-live="polite"></p>
      <ul class="gm-list" id="gmList"></ul>
    </div></section>
    <footer class="wrap foot small"><span data-c="footer"></span> · <a id="termsLink" href="/syarat-ketentuan" data-t="terms"></a> · <a id="hubLink" href="https://gamehub.jadidaring.com/">Game Hub</a></footer>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobby" class="screen" hidden>
    <div class="wrap lobbywrap">
      <div class="card">
        <div class="lobby-head">
          <div><p class="kicker" data-t="roomCode"></p><div class="code" id="roomCode">------</div></div>
          <div class="row wrapbtns"><button type="button" class="btn lamp" id="inviteBtn" data-t="invite"></button><button type="button" class="btn ghost" id="lobbyLeave" data-t="leave"></button></div>
        </div>
        <p class="muted small" id="lobbyVis"></p>
        <h3><span data-t="players"></span> <span id="pCount" class="muted"></span></h3>
        <ul class="plist" id="pList"></ul>
        <div class="row"><span class="lbl" data-t="bots"></span><div class="seg" id="onBots" role="radiogroup"><button type="button" data-v="0">0</button><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button></div></div>
        <p class="muted small" data-t="botsNote"></p>
        <div id="hostBox"><div class="row"><button type="button" class="btn lamp big" id="startBtn" data-t="start"></button></div></div>
        <p class="muted center" id="lobbyWait"></p>
      </div>
      <div class="card chatcard" id="lobbyChatSlot"></div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen" hidden>
    <canvas id="board" aria-label="Jalur pendakian"></canvas>
    <div class="hud">
      <div class="hud-row">
        <button type="button" class="chip dark" id="exitBtn" data-t="exit"></button>
        <div class="prog" id="prog" aria-label="Progres"><div class="prog-fill" id="progFill"></div><span class="pmk" style="left:25%">1</span><span class="pmk" style="left:50%">2</span><span class="pmk" style="left:75%">3</span><span class="pmk top" style="left:100%">⛩</span><div id="progDots"></div></div>
        <button type="button" class="chip dark" id="helpBtn" aria-label="Bantuan">❓<kbd class="kk">H</kbd></button>
        <button type="button" class="chip dark" id="pauseBtn" data-t="pause" hidden></button>
        <button type="button" class="chip dark" id="muteBtn2" aria-label="Suara"></button>
      </div>
      <div class="hud-row two">
        <div class="meter fog" title="Kabut"><span>🌫️</span><div class="bar"><i id="fogFill"></i></div><b id="fogTxt"></b></div>
        <div class="meter bat" title="Baterai"><span>🔋</span><div class="bar"><i id="batFill"></i></div></div>
        <div class="meter fear" title="Takut"><span id="fearIc">😨</span><div class="bar"><i id="fearFill"></i></div></div>
      </div>
      <ul class="team" id="team"></ul>
    </div>
    <div class="tut" id="tutBox" hidden><span class="tut-n" id="tutN"></span><span class="tut-t" id="tutT"></span><button type="button" class="tut-skip" id="tutSkip" data-t="skip"></button></div>
    <div class="banner" id="banner" hidden></div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="help" id="help" hidden></div>
    <div class="ctrls" id="ctrls">
      <div class="joy" id="joy" aria-label="Gerak"><div class="knob" id="knob"></div></div>
      <div class="shoutpad" id="shouts"></div>
      <div class="abtns">
        <button type="button" class="act talk" id="chatBtn" aria-label="Chat">💬<kbd class="kk">Enter</kbd></button>
        <button type="button" class="act give" id="giveBtn"><span class="ic">🔋</span><span class="lb2" data-t="give"></span><kbd class="kk">Q</kbd></button>
        <button type="button" class="act pray" id="prayBtn"><span class="ic">🙏</span><span class="lb2" data-t="pray"></span><kbd class="kk">E</kbd></button>
        <button type="button" class="act light" id="lightBtn"><span class="ic">🔦</span><span class="lb2" id="lightLbl"></span><kbd class="kk">F</kbd></button>
      </div>
    </div>
    <div class="scare" id="scare" aria-hidden="true"><svg class="sp" viewBox="0 0 200 260"><defs><linearGradient id="scSh" x1="0" x2="1"><stop offset="0" stop-color="#a9a393"/><stop offset=".45" stop-color="#f4f0e2"/><stop offset="1" stop-color="#8e887a"/></linearGradient><radialGradient id="scHole" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#1a140e"/><stop offset="1" stop-color="#000"/></radialGradient><radialGradient id="scSkin" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#b9b8a2"/><stop offset=".7" stop-color="#7d7d68"/><stop offset="1" stop-color="#3b3a2e"/></radialGradient></defs><path d="M100 30c-10-22-34-26-30-8 2 9 14 12 26 10-12 4-20 14-14 18M100 30c10-22 34-26 30-8-2 9-14 12-26 10" fill="#e6e0cf" stroke="#9c947f" stroke-width="2"/><path d="M100 34C46 36 30 92 32 156c2 56 26 100 68 100s66-44 68-100c2-64-14-120-68-122z" fill="url(#scSh)"/><path d="M80 40l40-1M50 200q50 16 100 0M44 120q10 40 6 70M156 120q-10 40-6 70M62 222q38 10 76 0" stroke="#8a826e" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/><path d="M58 112c0-30 18-46 42-46s44 16 44 46c0 34-16 64-44 64s-42-30-42-64z" fill="url(#scHole)"/><path d="M66 114c0-24 14-38 34-38s36 14 36 38c0 28-14 54-36 54s-34-26-34-54z" fill="url(#scSkin)"/><ellipse cx="83" cy="108" rx="13" ry="15" fill="#000"/><ellipse cx="117" cy="108" rx="13" ry="15" fill="#000"/><path d="M68 96q15-8 28 4M132 96q-15-8-28 4" stroke="#2b291f" stroke-width="4" fill="none"/><circle cx="85" cy="112" r="2.2" fill="#f5f5e8"/><circle cx="115" cy="112" r="2.2" fill="#f5f5e8"/><path d="M83 123q-2 14-4 22M117 123q2 12 3 18" stroke="#1d1c15" stroke-width="2.4" opacity=".7"/><ellipse cx="100" cy="148" rx="11" ry="15" fill="#050302"/><path d="M92 137l3 5 3-5 3 5 3-5" stroke="#cfc7a8" stroke-width="2" fill="none"/></svg><svg class="sk" viewBox="0 0 200 260"><defs><radialGradient id="scKf" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#f6f2ea"/><stop offset=".8" stop-color="#cfc8bd"/><stop offset="1" stop-color="#8a8378"/></radialGradient></defs><path d="M100 4C38 4 22 64 22 130c0 56-12 96-20 130h196c-8-34-20-74-20-130 0-66-16-126-78-126z" fill="#040306" stroke="#3a3446" stroke-width="3"/><path d="M70 168q30 14 60 0l30 92H40z" fill="#d9d6e2" opacity=".55"/><ellipse cx="100" cy="118" rx="38" ry="52" fill="url(#scKf)"/><path d="M60 74q40-38 80 0l-2 60q-6-40-30-50l-4 18-4-18q-26 10-36 50z" fill="#040306"/><path d="M64 140q-6 50 4 90M136 140q6 50-4 90" stroke="#040306" stroke-width="12" fill="none"/><ellipse cx="86" cy="118" rx="10" ry="8" fill="#200000"/><ellipse cx="116" cy="118" rx="10" ry="8" fill="#200000"/><circle cx="86" cy="118" r="4.5" fill="#ff1a1a"/><circle cx="116" cy="118" r="4.5" fill="#ff1a1a"/><circle cx="86" cy="118" r="9" fill="#ff1a1a" opacity=".25"/><circle cx="116" cy="118" r="9" fill="#ff1a1a" opacity=".25"/><path d="M84 146q16 34 32 0q-2 34-16 38-14-4-16-38z" fill="#1a0404"/><path d="M90 150l3 8 3-8 4 8 4-8 3 8 3-8" stroke="#e8e2d0" stroke-width="2" fill="none"/><path d="M86 126q-2 10 0 18M116 126q2 10 0 18" stroke="#8a0a0a" stroke-width="2" opacity=".8"/></svg></div>
    <div class="drawer" id="gameChatSlot" hidden></div>
  </div>

  <!-- ============ END ============ -->
  <div id="end" class="screen" hidden>
    <div class="wrap lobbywrap">
      <div class="card center endcard">
        <p class="kicker" id="endKicker"></p>
        <h2 id="endTitle"></h2>
        <p class="muted" id="endSub"></p>
        <div class="bigstars" id="endStars"></div>
        <ul class="tally" id="endTally"></ul>
        <ul class="crew endcrew" id="endCrew"></ul>
        <div class="row wrapbtns centerrow"><button type="button" class="btn lamp big" id="againBtn" data-t="again"></button><button type="button" class="btn ghost" id="toLobbyBtn" data-t="toLobby"></button><button type="button" class="btn ghost" id="endMenu" data-t="menu"></button></div>
        <p class="muted small" id="endWait"></p>
      </div>
      <div class="card chatcard" id="endChatSlot"></div>
    </div>
  </div>
</main>
<div class="chat" id="chat">
  <div class="chat-log" id="chatLog" aria-live="polite"></div>
  <form class="chat-form" id="chatForm"><input type="text" id="chatInput" maxlength="120" autocomplete="off" enterkeyhint="send" data-tp="chatPh" aria-label="Chat"><button type="submit" class="btn small red" data-t="send"></button></form>
</div>
<div id="toasts" aria-live="polite"></div>

</script>
<script>

<script>

<script>

</body>
</html>
