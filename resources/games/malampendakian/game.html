<meta name="description" content="Malam Pendakian: game horor co-op yang bisa mabar di HP tanpa download. Mendaki gunung malam hari bareng 1&#x2013;4 teman, berbagi baterai senter, sorot pocong dan kuntilanak, dan capai puncak sebelum kabut turun. Ada bot untuk main sendiri, chat, dan ping cepat.">

<meta property="og:description" content="Naik gunung tengah malam bareng teman. Senter terbatas, pocong mendekat, kabut turun. Gratis di browser HP.">
<style>
:root{--bg:#070b16;--bg2:#0e1528;--card:#121b31;--card2:#18233d;--line:#26345a;--ink:#eef1fa;--mut:#9aa6c4;--lamp:#ffb347;--lamp2:#ffd166;--red:#e8282b;--green:#3fb37f;--purple:#a77bff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1b2747 0%,rgba(7,11,22,0) 60%),radial-gradient(800px 500px at 90% 110%,#2a1530 0%,rgba(7,11,22,0) 60%),var(--bg);overflow-x:hidden}
[hidden]{display:none!important}
a{color:var(--lamp2)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#ffcf6a,#ff8f3c);font-size:22px;box-shadow:0 0 24px rgba(255,179,71,.45)}
.brand strong{display:block;font-size:17px;letter-spacing:.3px}.brand small{display:block;color:var(--mut);font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbtns{display:flex;gap:8px;align-items:center;flex:none}
.chip{border:1px solid var(--line);background:rgba(18,27,49,.85);border-radius:999px;padding:6px 11px;font-size:14px;line-height:1.2;min-height:34px}
.chip.dark{background:rgba(6,9,18,.62);border-color:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lb{border:0;background:transparent;padding:6px 10px;font-size:13px;font-weight:700;color:var(--mut)}.lb.on{background:var(--lamp);color:#2a1605}
/* hero */
.hero{padding-top:6px}
.herobox{position:relative;height:clamp(230px,44vw,340px);border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#05070c;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03)}
#heroCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.herotext{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;background:linear-gradient(180deg,rgba(5,7,12,0) 0%,rgba(5,7,12,.82) 70%);pointer-events:none}
.title{margin:0;line-height:.9;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.title .t1{display:block;font-size:clamp(22px,5vw,34px);color:#cfd8ff;letter-spacing:8px}
.title .t2{display:block;font-size:clamp(36px,9vw,64px);background:linear-gradient(180deg,#ffe3a1 0%,#ffb347 55%,#e8572c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,179,71,.35))}
.kick{margin:6px 0 0;color:#ffd9a0;font-weight:700;font-size:13px}
.lead{color:#c9d1e8;margin:12px 2px 4px;max-width:760px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding-top:12px;padding-bottom:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28);min-width:0}
.card h2{margin:0 0 8px;font-size:18px}.card h3{margin:14px 0 4px;font-size:15px}
.field{display:block}.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0a1122;color:var(--ink);outline:none;min-height:44px}
input[type=text]:focus{border-color:var(--lamp);box-shadow:0 0 0 3px rgba(255,179,71,.2)}
#nameInput::placeholder,#codeInput::placeholder,#chatInput::placeholder,.jr-inv-input::placeholder{color:#8b93a7;opacity:1}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--mut);font-weight:700;min-width:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#0a1122;padding:8px 14px;min-width:44px;min-height:40px;font-weight:800;color:var(--mut)}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--lamp);color:#2a1605}.seg.ro{opacity:.6}.seg.ro button{cursor:default}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;min-height:44px;background:#24304f;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lamp{background:linear-gradient(180deg,#ffd27a,#ff9f3a);color:#2a1605;box-shadow:0 3px 0 #a85a12,0 0 22px rgba(255,179,71,.3)}
.btn.red{background:linear-gradient(180deg,#ff5a4e,#c81f22);box-shadow:0 3px 0 #7a1012}
.btn.green{background:linear-gradient(180deg,#4fd396,#2a9466);box-shadow:0 3px 0 #17583b}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.big{padding:13px 22px;font-size:17px}.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.wrapbtns .btn{flex:1 1 auto}
.joinrow{flex-wrap:nowrap}.joinrow input{text-transform:uppercase;letter-spacing:4px;font-weight:800;text-align:center;flex:1;min-width:0}
.note{background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.35);border-radius:10px;padding:8px 10px;color:#ffd9a0}
.how{display:grid;gap:10px}.how .st{display:flex;gap:12px;align-items:center}.how canvas{flex:none;border-radius:12px}.how span{font-size:14px;color:#d3daee}
.foot{color:var(--mut);padding:14px 16px 90px;text-align:center}
/* gm */
.gm-card{margin-bottom:14px;border-color:#7a2b2b}.gm-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gm-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}.gm-list li{display:flex;align-items:center;gap:10px;background:#0a1122;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.gm-list .code{font-family:ui-monospace,monospace;letter-spacing:2px;color:var(--lamp2)}.gm-meta{flex:1;min-width:0}.gm-act{display:flex;gap:6px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#1f6f4a}.badge.priv{background:#7a2b2b}.badge.st{background:#2b3f7a}
.gm-tag{color:#ff5a5a;font-style:normal;font-weight:800}
/* lobby / end */
.lobbywrap{display:grid;gap:14px;padding-top:18px;padding-bottom:40px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:760px){.lobbywrap{grid-template-columns:minmax(0,1fr)}}
.lobby-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.kicker{margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--lamp)}
.code{font:900 34px/1.1 ui-monospace,monospace;letter-spacing:6px;color:#fff}
.plist,.crew{list-style:none;margin:6px 0;padding:0;display:grid;gap:6px}
.plist li,.crew li{display:flex;align-items:center;gap:8px;background:#0a1122;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.plist li span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plist li.bot{opacity:.8;border-style:dashed}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.tag{font-size:11px;background:#24304f;border-radius:99px;padding:1px 8px;color:#c9d1e8}
.chatcard{padding:10px;display:flex;flex-direction:column;min-height:240px}
.endcard h2{font-size:26px;margin:6px 0}.endcard .muted{max-width:440px;margin:0 auto}
#end.won .endcard{border-color:#8a6a1e;box-shadow:0 0 60px rgba(255,179,71,.18)}#end.lost .endcard{border-color:#4b3a7a}
.bigstars{font-size:40px;letter-spacing:6px;margin:10px 0}.bigstars span{filter:grayscale(1) brightness(.4);display:inline-block;transition:.3s}.bigstars span.on{filter:none;animation:pop .5s both}
.bigstars span.on:nth-child(2){animation-delay:.25s}.bigstars span.on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.tally{list-style:none;padding:0;margin:8px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;max-width:520px}
.tally li{background:#0a1122;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}.tally b{color:#fff}
.endcrew{max-width:520px;margin:8px auto;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.centerrow{justify-content:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.chat-log{flex:1;min-height:120px;max-height:260px;overflow-y:auto;overscroll-behavior:contain;background:#0a1122;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.chat-log p{margin:0 0 4px;word-wrap:break-word}.chat-log p.sys{color:var(--mut);font-style:italic;font-size:12px}.chat-log p.sh{color:#ffd9a0}
.chat-form{display:flex;gap:6px}.chat-form input{flex:1;min-width:0}
/* toasts / banner / overlay */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top));z-index:60;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:rgba(14,21,40,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;text-align:center;animation:tin .25s both;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.toast.good{border-color:#2f8a5f;color:#bff3d6}.toast.warn{border-color:#a8641d;color:#ffd9a0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ================= GAME ================= */
#game{position:fixed;inset:0;overflow:hidden;background:#05070c;touch-action:none;user-select:none;-webkit-user-select:none;z-index:20}
#board{position:absolute;inset:0;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none;display:grid;gap:6px}
.hud button,.hud .team{pointer-events:auto}
.hud-row{display:flex;gap:8px;align-items:center}
.prog{position:relative;flex:1;height:12px;border-radius:99px;background:rgba(6,9,18,.7);border:1px solid rgba(255,255,255,.14);margin:0 14px 0 4px}
.prog-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ff9f3a,#ffe08a);box-shadow:0 0 12px rgba(255,179,71,.6);width:0}
.pmk{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#1a2340;border:2px solid #ffb347;font:800 10px/14px system-ui;text-align:center;color:#ffd9a0}
.pmk.top{background:#3a1010;border-color:#e8282b;font-size:10px}
#progDots i{position:absolute;top:-6px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);border:1px solid #000}
.hud-row.two{gap:6px}
.meter{display:flex;align-items:center;gap:5px;flex:1;min-width:0;background:rgba(6,9,18,.62);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:3px 9px 3px 6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.meter span{font-size:14px;flex:none}.meter b{font-size:11px;color:#c9d1e8;flex:none;font-variant-numeric:tabular-nums}
.meter .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.meter .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .2s}
.meter.fog i{background:linear-gradient(90deg,#8ea0c8,#d8def0)}.meter.bat i{background:linear-gradient(90deg,#f3c63c,#9be15d)}.meter.fear i{background:linear-gradient(90deg,#b46ad9,#ff3a5c)}
.meter.hot{border-color:#ff5a5a;animation:hot 1s infinite}.meter.bat.hot i{background:#ff5a4e}
@keyframes hot{50%{box-shadow:0 0 14px rgba(255,80,80,.55)}}
.team{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:46vw}
.team li{display:flex;align-items:center;gap:5px;background:rgba(6,9,18,.6);border-radius:99px;padding:2px 8px 2px 5px;font-size:11px;max-width:100%}
.team li.me{border:1px solid rgba(255,209,102,.6)}.team li.dn{background:rgba(80,30,110,.75);animation:hot 1s infinite}
.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}.team .dot{width:8px;height:8px}
.team .tb{width:34px;height:4px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;flex:none}.team .tb i{display:block;height:100%;background:#f3c63c}
.tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));width:min(94vw,460px);display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(40,28,10,.94),rgba(24,16,6,.94));border:1px solid #a8741d;border-radius:14px;padding:9px 10px 9px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(255,179,71,.18);z-index:5;animation:tutIn .3s both}
.tut-n{flex:none;font:900 12px system-ui;background:var(--lamp);color:#2a1605;border-radius:99px;padding:2px 8px}.tut-t{flex:1;font-size:14px;line-height:1.35}.tut-t b{color:var(--lamp2)}
.tut-skip{flex:none;border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:99px;font-size:12px;padding:4px 10px;color:#ffd9a0}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:6;max-width:90vw;text-align:center;font:900 clamp(20px,5.4vw,30px)/1.2 system-ui;padding:12px 22px;border-radius:16px;background:rgba(6,9,18,.72);border:1px solid rgba(255,255,255,.14);text-shadow:0 2px 0 rgba(0,0,0,.5);pointer-events:none;animation:bin .35s both}
.banner small{display:block;font:600 14px/1.4 system-ui;color:#ffe9c4;margin-top:6px;text-shadow:none}
.banner.warm{border-color:#a8741d;color:#ffe08a;box-shadow:0 0 40px rgba(255,179,71,.3)}.banner.purple{border-color:#6b3fbf;color:#e6c2ff;box-shadow:0 0 40px rgba(167,123,255,.35)}
@keyframes bin{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(3,5,12,.7)}
.ovc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;max-width:88vw}.ovc b{font-size:22px}.ovc p{color:var(--mut);font-size:13px}
/* controls */
.ctrls{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:8px 10px;align-items:end;pointer-events:none;z-index:4}
.ctrls>*{pointer-events:auto}
.joy{grid-row:2;grid-column:1;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,rgba(255,255,255,.03) 60%,rgba(255,255,255,.07) 100%);border:2px solid rgba(255,255,255,.16);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a8,#ff9f3a 70%);box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 18px rgba(255,179,71,.35);pointer-events:none}
.shoutpad{grid-row:1;grid-column:1/3;display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:0 2px}
.shoutpad::-webkit-scrollbar{display:none}
.shoutpad button{flex:none;border:1px solid rgba(255,255,255,.14);background:rgba(6,9,18,.62);border-radius:99px;padding:4px 9px;display:flex;gap:3px;align-items:center;font-size:12px;min-height:32px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.shoutpad button:active{background:rgba(255,179,71,.35)}.shoutpad small{font-size:11px;font-weight:700;color:#dfe5f5}
.abtns{grid-row:2;grid-column:2;display:grid;grid-template-columns:repeat(2,auto);grid-template-areas:"talk give" "pray light";gap:10px;justify-content:end;align-items:end}
.act{position:relative;border:2px solid rgba(255,255,255,.18);border-radius:50%;width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,26,.72);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none;transition:transform .08s,opacity .2s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.act .ic{font-size:24px;line-height:1}.act .lb2{font-size:10px;font-weight:800;margin-top:1px;color:#dfe5f5}
.act.hit{transform:scale(.92)}.act.dim{opacity:.5}
.act.light{grid-area:light;width:82px;height:82px;background:radial-gradient(circle at 35% 30%,#ffe3a8,#ff9f3a 75%);border-color:#ffd27a;box-shadow:0 0 28px rgba(255,179,71,.5),0 4px 14px rgba(0,0,0,.5)}
.act.light .lb2{color:#2a1605}.act.light.off{background:radial-gradient(circle,#2a3250,#151b30);border-color:rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.5)}.act.light.off .lb2{color:#9aa6c4}
.act.pray{grid-area:pray}.act.give{grid-area:give}.act.talk{grid-area:talk;width:48px;height:48px;justify-self:end;font-size:20px}
.act.pray.on{background:radial-gradient(circle,#ffe08a,#c08a1e);border-color:#ffe08a}
.act.glow{animation:glow 1s infinite;opacity:1}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,209,102,.25),0 0 26px rgba(255,209,102,.6)}}
.act.ping::after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}

   * o.join(name) -> Promise<{ok:true} | {ok:false, missing?:true, retry?:true, message?:string}>

      '<form class="jr-inv-form" hidden novalidate><label class="jr-inv-label" for="jr-inv-name">' + esc(T.nameLabel) + '</label><input class="jr-inv-input" id="jr-inv-name" type="text" maxlength="' + (o.nameMax || 24) + '" autocomplete="off" enterkeyhint="go" placeholder="JadiDaring">' +
      '<p class="jr-inv-err" role="alert"></p><button class="jr-inv-go" type="submit">' + esc(T.join) + '</button></form>' +
      '<button class="jr-inv-alt" type="button">' + esc(T.menu) + '</button></div>';

    var form = root.querySelector('form'), input = root.querySelector('input'), err = root.querySelector('.jr-inv-err'), go = root.querySelector('.jr-inv-go'), wait = root.querySelector('.jr-inv-wait');

    + '<input id="gmClaimInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Masukkan kode" maxlength="128" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #bbb;border-radius:8px;font:inherit;color:#222;background:#fff">'
    + '<p id="gmClaimErr" role="alert" style="color:#c0392b;min-height:1.2em;margin:6px 0;font-size:13px"></p>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="gmClaimCancel" style="padding:6px 12px;border-radius:8px;border:1px solid #bbb;background:#f3f3f3;color:#222;font:inherit">Batal</button>'
    + '<button type="submit" id="gmClaimOk" style="padding:6px 12px;border-radius:8px;border:0;background:#c0392b;color:#fff;font:600 14px system-ui,sans-serif">Masuk</button></div></form>';
  d.body.appendChild(m);
  const inp = m.querySelector('#gmClaimInput'), er = m.querySelector('#gmClaimErr'), ok = m.querySelector('#gmClaimOk');
  // no visible chip: only a ?gmjd query param (not the secret; value ignored) arms the prompt; intent survives the home/gate screen until a room is entered
  const trig = () => /[?&]gmjd(=|&|$)/i.test(w.location.search || '');
  let busy = false, want = trig(), asked = false;
  const close = () => { m.style.display = 'none'; inp.value = ''; er.textContent = ''; };
  const open = () => { if (!canClaim()) return; er.textContent = ''; inp.value = ''; m.style.display = 'flex'; setTimeout(() => inp.focus(), 20); };
  m.addEventListener('click', e => { if (e.target === m) close(); });
  m.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') close(); });
  m.addEventListener('keyup', e => e.stopPropagation());
  m.querySelector('#gmClaimCancel').addEventListener('click', close);
  m.querySelector('#gmClaimForm').addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation(); const code = inp.value.trim(); if (!code || busy) { inp.focus(); return; }
    busy = true; ok.disabled = true; er.textContent = '';
    try {
      await claim(code); want = false; close();
      // strip ?gmjd so a refresh doesn't re-prompt (other params like ?room= are kept)
      if (trig() && w.history && w.history.replaceState) { const u = new URL(w.location.href); for (const k of [...u.searchParams.keys()]) if (k.toLowerCase() === 'gmjd') u.searchParams.delete(k); w.history.replaceState(w.history.state, '', u.pathname + u.search + u.hash); }
      sync(); if (onDone) onDone();
    }
    catch (x) { inp.value = ''; er.textContent = x && x.status === 403 ? 'Kode salah.' : 'Gagal, coba lagi.'; inp.focus(); }
    finally { busy = false; ok.disabled = false; }
  });
  function sync() {
    const on = !!canClaim();
    if (!on) { asked = false; if (m.style.display !== 'none' && !busy) close(); return; }
    if (want && !asked) { asked = true; open(); }
  }
  return { sync, open, close };
}
async function gmLoad() {
  if (!gm || gmBusy) return; if (!onlineOk) { renderGm(); return; }
  gmBusy = true; gmAt = Date.now(); renderGm();
  try { const d = await conn.rooms({ gm: true }); gmRooms = Array.isArray(d && d.rooms) ? d.rooms : []; gmErr = ''; } catch (e) { gmErr = errMsg(e); } finally { gmBusy = false; renderGm(); }
}
function gmWake() { if (!gm || room) return; clearTimeout(gmWakeT); gmWakeT = setTimeout(gmLoad, 1200); }
function renderGm() {
  const box = $('gmRooms'); if (!box) return; box.hidden = !gm; if (!gm) return; const list = gmRooms || [];
  $('gmNote').textContent = !conn.allowed ? T('onlineOff') : !onlineOk ? (conn.failed ? T('onlineDown') : T('gmLoading')) : gmErr ? T('gmErr', { msg: gmErr }) : gmRooms === null ? T('gmLoading') : list.length ? T('gmCount', { n: list.length }) : T('gmEmpty');
  $('gmRefresh').disabled = !onlineOk || gmBusy;
  $('gmList').innerHTML = list.map(r => {
    const code = esc(r.code), priv = r.visibility === 'private', playing = r.status === 'playing';
    return '<li data-code="' + code + '"><b class="code">' + code + '</b><span class="gm-meta"><span class="badge' + (priv ? ' priv">' + esc(T('gmPrivate')) : '">' + esc(T('gmPublic'))) + '</span> <span class="badge st">' + esc(T(playing ? 'gmPlaying' : 'gmWaiting')) + '</span><br><small class="muted">'
      + esc(T('gmPlayers', { n: Number(r.seated) || 0, max: Number(r.maxPlayers) || 0, w: Number(r.spectators) || 0 })) + '</small></span><span class="gm-act">'
      + (playing ? '' : '<button type="button" class="btn green small online-btn" data-gm="join" data-code="' + code + '">' + esc(T('gmJoin')) + '</button>')
      + '<button type="button" class="btn ghost small online-btn" data-gm="watch" data-code="' + code + '">' + esc(T('gmWatch')) + '</button></span></li>';
  }).join('');
}
async function gmEnter(kind, code) {
  if (!/^[A-Z2-9]{6}$/.test(code || '')) return; $('codeInput').value = code; if (kind === 'join') return onlineAction('join');
  const name = myName(); if (!name) { toast(T('errName'), 'warn'); $('nameInput').focus(); return; }
  setLS(NAME_KEY, name); try { await enterOnline('watch', { displayName: name, code }); } catch (e) { toast(errMsg(e), 'warn', 4000); }
}
function onlineNote() { const n = $('onlineNote'); if (!n) return; const msg = !conn.allowed ? T('onlineOff') : (conn.failed ? T('onlineDown') : ''); n.textContent = msg; n.hidden = !msg; }

/* =====================================================================
   HOME: how-to strip, best line
   ===================================================================== */
function renderHow() {
  const el = $('howList'); if (!el) return;
  el.innerHTML = [1, 2, 3, 4].map(i => '<div class="st"><canvas data-i="' + i + '" width="84" height="60"></canvas><span>' + T('how' + i) + '</span></div>').join('');
  const hc = $('howCtl'); if (hc) hc.innerHTML = helpHtml(false);
  el.querySelectorAll('canvas').forEach(c => {
    const r = Math.min(2.5, root.devicePixelRatio || 1), w = 84, hh = 60; c.width = w * r; c.height = hh * r; c.style.width = w + 'px'; c.style.height = hh + 'px';
    const g = c.getContext('2d'), i = +c.dataset.i, now = 1200, ts = 30; g.setTransform(r, 0, 0, r, 0, 0);
    const bg = g.createRadialGradient(w / 2, hh / 2, 4, w / 2, hh / 2, w * 0.7); bg.addColorStop(0, '#24304a'); bg.addColorStop(1, '#0b1020'); g.fillStyle = bg; R.rr(g, 0, 0, w, hh, 12); g.fill();
    const H = (c0, f, extra) => Object.assign({ id: 9, c: c0, f, on: 1, bat: 80, fear: 10, dn: 0, walk: 0, rvp: 0 }, extra || {});
    const cone = (x, y, a) => { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(x, y, 2, x, y, 46); gr.addColorStop(0, 'rgba(255,226,150,.55)'); gr.addColorStop(1, 'rgba(255,226,150,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(x, y); g.arc(x, y, 46, a - 0.5, a + 0.5); g.closePath(); g.fill(); g.restore(); };
    if (i === 1) { g.strokeStyle = '#e8282b'; g.lineWidth = 3; g.beginPath(); g.moveTo(60, 14); g.lineTo(70, 22); g.stroke(); g.fillStyle = '#6b4a2c'; g.fillRect(58, 12, 3, 30); cone(26, 40, -0.9); R.drawHiker(g, 26, 48, ts, H(0, -0.9), now, { light: true }); R.drawHiker(g, 42, 52, ts, H(1, -1.2), now, { light: true }); }
    if (i === 2) { cone(20, 40, -0.2); R.drawHiker(g, 20, 48, ts, H(2, -0.2), now, { light: true }); R.drawPocong(g, 62, 48, ts, { id: 1, ph: 0.8, fr: 1, lt: 1 }, now, 1); g.strokeStyle = '#fff1a8'; g.lineWidth = 2.5; g.beginPath(); g.arc(62, 30, 8, -Math.PI / 2, Math.PI); g.stroke(); }
    if (i === 3) { R.drawHiker(g, 30, 46, ts, H(1, 0, { dn: 1, rvp: 0.6 }), now, {}); R.drawHiker(g, 56, 48, ts, H(3, Math.PI, { rv: 1 }), now, { light: false }); g.font = '18px system-ui'; g.textAlign = 'center'; g.fillText('\ud83d\ude4f', 58, 18); }
    if (i === 4) { g.font = '26px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('\ud83c\udfee', 24, 32); g.fillText('\u26e9\ufe0f', 62, 30); g.fillStyle = '#ffd166'; g.font = '900 16px system-ui'; g.fillText('\u2192', 43, 32); }
  });
}
function renderBest() { let b = {}; try { b = JSON.parse(getLS(BEST_KEY) || '{}') || {}; } catch (e) { b = {}; } const el = $('bestLine'); if (el) el.textContent = b.s ? T('best', { s: b.s, t: fmtT(b.t) }) : T('bestNone'); }

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  $('nameInput').value = getLS(NAME_KEY) || '';
  $('nameInput').addEventListener('change', () => setLS(NAME_KEY, myName()));
  soloBots = Math.max(0, Math.min(3, saved.bots == null ? 2 : saved.bots | 0));
  seg('soloBots', soloBots, v => { soloBots = v; saved.bots = v; saveSet(); });
  onBotsPaint = seg('onBots', saved.obots | 0, v => setBots(v));
  doc.querySelectorAll('.lb').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; setLS(LANG_KEY, lang); applyLang(); }));
  const mute = () => { muted = !muted; setLS(MUTE_KEY, muted ? '1' : '0'); paintMute(); if (muted) ambience(false); else { SFX.click(); if (!$('game').hidden) ambience(true); } };
  $('muteBtn').addEventListener('click', mute); $('muteBtn2').addEventListener('click', mute);
  $('practiceBtn').addEventListener('click', () => { setLS(NAME_KEY, myName()); ac(); startSolo(); });
  $('tutBtn').addEventListener('click', () => { setLS(NAME_KEY, myName()); ac(); startSolo({ tut: true }); });
  $('createPub').addEventListener('click', () => { ac(); onlineAction('public'); });
  $('createPriv').addEventListener('click', () => { ac(); onlineAction('private'); });
  $('matchBtn').addEventListener('click', () => { ac(); onlineAction('match'); });
  $('joinForm').addEventListener('submit', e => { e.preventDefault(); ac(); onlineAction('join'); });
  $('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  $('inviteBtn').addEventListener('click', invite); $('lobbyLeave').addEventListener('click', () => exitToMenu(false));
  $('startBtn').addEventListener('click', () => { ac(); startOnline(); });
  $('exitBtn').addEventListener('click', confirmExit); $('pauseBtn').addEventListener('click', togglePause); $('helpBtn').addEventListener('click', () => toggleHelp());
  $('againBtn').addEventListener('click', () => { ac(); if (mode === 'solo') startSolo(); else startOnline(); });
  $('toLobbyBtn').addEventListener('click', toLobby); $('endMenu').addEventListener('click', () => exitToMenu(false));
  root.addEventListener('resize', fit); if (root.visualViewport) root.visualViewport.addEventListener('resize', fit);
  root.addEventListener('pagehide', () => { if (room) conn.leaveBeacon(); });
  doc.addEventListener('visibilitychange', () => { if (doc.visibilityState === 'visible') { if (conn.config) conn.visible(); } else if (mode === 'solo' && sim && sim.ph === 'run' && !paused) togglePause(); });
  $('gmRefresh').addEventListener('click', gmLoad);
  $('gmList').addEventListener('click', e => { const b = e.target.closest('[data-gm]'); if (b) gmEnter(b.dataset.gm, b.dataset.code); });
  root.addEventListener('hashchange', gmSync); setInterval(() => { if (gm && !room && doc.visibilityState === 'visible' && Date.now() - gmAt > 10000) gmLoad(); }, 2000);
  gmSync(); gmUI = gmClaimUI({ listKey: N.GM_KEY, canClaim: () => mode === 'online' && !!room && !!room.data && !room.local && !room.isGamemaster(), claim: code => room.claimGamemaster(code), onDone: () => { toast('Mode gamemaster aktif', 'good'); gmMeSync(); hudKey = ''; if (room) renderRoom(); } });

  const route = () => { const h = (location.hash || '').toLowerCase(); if (room) return; if (h === '#latihan') startSolo(); else if (h === '#tutorial') startSolo({ tut: true }); else if (h === '#demo') startDemo(); };
  route(); root.addEventListener('hashchange', route);

  }
}
if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot); else boot();

  shout, sendChat, startSolo, startOnline, startDemo, toggleLight, give, setPray, conn, joy, aim, keys, tutEnd: () => tutEnd(true) };
})(window);
