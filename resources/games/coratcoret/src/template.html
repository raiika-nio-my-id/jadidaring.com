<a class="skip" href="#main" data-i18n="skip"></a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#top" id="brandLink"><span class="brand-mark" aria-hidden="true"></span><span><strong data-c="site.name"></strong><small data-i18n="kicker"></small></span></a>
    <nav class="site-nav" aria-label="Menu" id="siteNav"><a href="#play" data-i18n="navPlay"></a><a href="#rules" data-i18n="navRules"></a></nav>
    <div class="header-tools">
      <span class="conn" id="conn" role="status" aria-live="polite"></span>
      <button class="chip" type="button" id="langBtn"></button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="home">
    <section class="hero" id="top" aria-labelledby="heroTitle">
      <div class="wrap">
        <div>
          <span class="eyebrow" data-i18n="heroEyebrow"></span>
          <h1 id="heroTitle" data-i18n="heroTitle"></h1>
          <p class="lead" data-i18n="heroText"></p>
          <div class="cta">
            <a class="btn primary" href="#play" data-i18n="heroCtaOnline"></a>
            <a class="btn yellow" href="#practice" data-i18n="heroCtaPractice"></a>
          </div>
        </div>
        <div class="art" role="img" data-i18n-aria="artLabel">
          <span class="tape"></span><span class="slots" data-i18n="heroHint"></span>
          <span class="sun"></span><span class="roof"></span>
          <span class="house"><span class="win"></span><span class="door"></span></span>
          <span class="ground"></span><span class="pencil"></span>
          <span class="bubble b1" data-i18n-list="heroBubbles" data-index="0"></span>
          <span class="bubble b2" data-i18n-list="heroBubbles" data-index="1"></span>
          <span class="bubble b3" data-i18n-list="heroBubbles" data-index="2"></span>
        </div>
      </div>
    </section>

    <section class="section" id="play" aria-label="Main">
      <div class="wrap play-grid">
        <article class="panel online" aria-labelledby="onlineTitle">
          <span class="eyebrow" data-i18n="onlineEyebrow"></span>
          <h2 id="onlineTitle" data-i18n="onlineTitle"></h2>
          <p class="muted" data-i18n="onlineText"></p>
          <div class="row">
            <label class="field grow"><span><span data-i18n="nameLabel"></span> <em class="gm-badge" id="gmNickBadge">(GM)</em></span><input type="text" id="nameInput" maxlength="24" autocomplete="off" data-i18n-ph="namePlaceholder"></label>
            <label class="field"><span data-i18n="maxLabel"></span><select id="maxSelect"></select></label>
          </div>
          <div class="row">
            <button class="btn primary online-btn" type="button" id="createPrivate" data-i18n="createPrivate"></button>
            <button class="btn yellow online-btn" type="button" id="createPublic" data-i18n="createPublic"></button>
            <button class="btn teal online-btn" type="button" id="quickMatch" data-i18n="quickMatch"></button>
          </div>
          <p class="note muted" id="privateNote" style="margin:6px 0 0;font-size:.8rem"></p>
          <div class="divider" data-i18n="or"></div>
          <form class="row" id="joinForm">
            <label class="field grow" style="margin:0"><span data-i18n="codeLabel"></span><input type="text" id="codeInput" class="code-input" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234" inputmode="text"></label>
            <button class="btn online-btn" type="submit" id="joinBtn" data-i18n="join"></button>
            <button class="btn ghost online-btn" type="button" id="watchBtn" data-i18n="watch"></button>
          </form>
          <p class="note" id="onlineNote" role="status" aria-live="polite"></p>
          <div class="rooms-head"><h3 id="roomsTitle" data-i18n="roomsTitle"></h3><button class="btn small ghost online-btn" type="button" id="refreshRooms" data-i18n="roomsRefresh"></button></div>
          <ul class="rooms" id="rooms"></ul>
        </article>

        <article class="panel practice" id="practice" aria-labelledby="practiceTitle">
          <span class="eyebrow" data-i18n="practiceEyebrow"></span>
          <h2 id="practiceTitle" data-i18n="practiceTitle"></h2>
          <p class="muted" data-i18n="practiceText"></p>
          <div class="mode-list">
            <section class="mode" aria-labelledby="soloTitle">
              <h3 id="soloTitle"><span class="dot" style="background:var(--coral)"></span><span data-i18n="soloTitle"></span></h3>
              <p data-i18n="soloText"></p>
              <button class="btn small primary" type="button" id="soloStart" data-i18n="soloStart"></button>
            </section>
            <section class="mode" aria-labelledby="doodleTitle">
              <h3 id="doodleTitle"><span class="dot" style="background:var(--teal)"></span><span data-i18n="doodleTitle"></span></h3>
              <p id="doodleText"></p>
              <button class="btn small teal" type="button" id="doodleStart" data-i18n="doodleStart"></button>
            </section>
            <section class="mode" aria-labelledby="partyTitle">
              <h3 id="partyTitle"><span class="dot" style="background:var(--yellow)"></span><span data-i18n="partyTitle"></span></h3>
              <p data-i18n="partyText"></p>
              <form id="partyForm">
                <fieldset style="border:0;padding:0;margin:0"><legend class="field" style="font-weight:800;font-size:.9rem;padding:0;margin-bottom:6px" data-i18n="partyPlayers"></legend>
                <ul class="party-names" id="partyNames"></ul></fieldset>
                <button class="btn small ghost" type="button" id="partyAdd" data-i18n="partyAdd"></button>
                <div class="row" style="margin-top:12px">
                  <label class="field"><span data-i18n="roundsLabel"></span><select id="partyRounds"></select></label>
                  <label class="field"><span data-i18n="timeLabel"></span><select id="partyTime"></select></label>
                </div>
                <button class="btn small yellow" type="submit" data-i18n="partyStart"></button>
                <p class="note err" id="partyNote" role="alert"></p>
              </form>
            </section>
          </div>
        </article>
      </div>
    </section>

    <section class="section" id="rules" aria-labelledby="rulesTitle">
      <div class="wrap">
        <div class="section-head"><span class="eyebrow" data-i18n="rulesEyebrow"></span><h2 id="rulesTitle" data-i18n="rulesTitle"></h2></div>
        <ol class="steps" id="steps"></ol>
        <p class="scoring" id="scoring"></p>
      </div>
    </section>
  </div>

  <section id="game" class="game" hidden aria-labelledby="gameTitle">
    <div class="wrap">
      <div class="g-top">
        <button class="btn small ghost" type="button" id="exitBtn">← <span data-i18n="exit"></span></button>
        <div class="g-meta"><h2 id="gameTitle"></h2><p id="gameSub"></p></div>
        <button class="chip g-lang" type="button" id="gLangBtn"></button>
        <div class="timer" id="timer" role="timer" aria-live="off"><span id="timerText">–</span></div>
        <div class="hint" id="hint" aria-live="polite"></div>
      </div>
      <div class="g-body">
        <aside class="g-players" aria-labelledby="playersTitle"><h3 id="playersTitle" data-i18n="players"></h3><ol class="plist" id="plist"></ol><p class="spec-count" id="specCount"></p></aside>
        <div class="g-stage">
          <div class="board-fit">
            <div class="board-wrap" id="boardWrap">
              <canvas id="board" width="800" height="600" role="img"></canvas>
              <div class="stage" id="stage" hidden></div>
            </div>
          </div>
          <div class="tools" id="tools" role="toolbar" hidden></div>
        </div>
        <aside class="g-chat" aria-labelledby="chatTitle">
          <div class="chat-head"><h3 id="chatTitle" data-i18n="chatTitle"></h3><button class="chat-toggle" type="button" id="chatToggle" aria-controls="chat" aria-expanded="false" hidden></button></div>
          <ol class="chat" id="chat" aria-live="polite" aria-relevant="additions"></ol>
          <form class="chat-form" id="chatForm"><label class="sr-only" for="chatInput" data-i18n="chatPlaceholder"></label><input type="text" id="chatInput" maxlength="60" autocomplete="off" enterkeyhint="send"><button class="btn small primary" type="submit" data-i18n="send"></button></form>
          <p class="chat-note" id="chatNote"></p>
          <div class="side-actions" id="sideActions"></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span><strong data-c="site.name"></strong> · <span data-i18n="footerNote"></span></span>
