    else body='<p><strong>Tujuanmu: bertahan paling lama.</strong> Kelola aset agar kamu menjadi pemain terakhir yang bertahan. Label P1\u2013P5 pada landmark mengikuti nomor pemain dan bidaknya; label N berarti milik kas negeri. Kepemilikan tidak perlu dibedakan hanya dari warna. Mainkan online dari perangkat masing-masing, atau gunakan latihan untuk bermain bergantian di satu perangkat.</p><ol class="rules-list"><li>Buat ruang, bagikan kode 6 karakter, lalu mulai setelah ada 2\u20135 warga. Modal awal setiap warga Rp10 juta.</li><li>Lempar dua dadu. Jika mendarat di landmark yang tersedia, kamu boleh membeli; jika milik orang lain, bayar sewa.</li><li>Melewati Mulai memberi Rp1 juta. Hanya saat gajian kamu boleh membangun. Maksimal dua penginapan; upgrade RESOR pada putaran berikutnya.</li><li>Dadu kembar memberi tepat satu Kabar Nasib bonus setelah efek lokasi selesai. Giliran tidak diulang. Setelah semua warga melewati MULAI dua kali, kartu lanjutan ditambahkan ke kedua tumpukan. Kartu ini dapat menyita landmark, merusak bangunan, atau menarik pungutan berdasarkan aset.</li><li>Ujian Hidup ditentukan satu dadu: 5\u20136 ringan, 3\u20134 sedang, 1\u20132 brutal. Payung Keberuntungan dapat membatalkan satu kartu.</li><li>Rutan: keluar dengan dadu kembar, bayar Rp1,5 juta, atau bebas pada giliran ketiga. Sewa asetmu selama dipenjara masuk ke kas negeri.</li><li>Iuran: Rp500 ribu per landmark. Parkiran Liar: Rp1 juta (gratis untuk pemilik Tanah Lot). Pemeriksaan Jalan: Rp500 ribu. Tol wajib bayar Rp500 ribu saat mendarat, kemudian wajib memilih tol tujuan, tanpa gaji. Tidak ada pilihan melewati tol.</li><li>Jika tak sanggup membayar, jual landmark dan bangunan dengan 50% nilai pembelian. Aset tersebut menjadi milik kas negeri dan tetap menarik sewa.</li></ol><h3>Lima persimpangan kehidupan</h3><p>Petak MULAI memberi gaji Rp1 juta ketika dilalui. Kunjungan Rutan gratis; keluar dari tahanan dapat memakai dadu kembar, membayar Rp1,5 juta, atau menunggu giliran ketiga. Iuran Tahunan menarik Rp500 ribu per landmark. Majelis Warga: dadu 5\u20136 menerima Rp1 juta, 3\u20134 membayar Rp1,5 juta dan masuk Rutan, 1\u20132 kehilangan 50% uang tunai dan masuk Rutan. Parkiran Liar menarik Rp1 juta, kecuali pemilik Tanah Lot. Gerbang tol wajib menarik Rp500 ribu dan memindahkan pemain ke gerbang lain tanpa gaji.</p><h3>Negeri dan kartu kejutan</h3><p>Landmark Indonesia mengelilingi Lembah Misteri pada papan segi lima dengan 45 petak. Setiap wilayah punya harga landmark, biaya bangunan, dan sewa tersendiri. Kabar Nasib berisi 40 kartu; Ujian Hidup berisi 23 kartu dengan tiga tingkat dampak. Kartu lanjutan masuk setelah seluruh pemain aktif menyelesaikan dua putaran. Tamu dari Langit memindahkan pemain ke Lembah Misteri; satu giliran berikutnya dipakai untuk kembali tanpa gaji dan tanpa mengulang efek petak asal.</p><p>Permainan berakhir ketika tinggal satu warga bertahan. Setiap giliran diberi waktu 2 menit; setelah habis, warga mana pun boleh melanjutkannya. Kewajiban pembayaran tetap diselesaikan dan tujuan tol dipilih otomatis jika belum dipilih. Penjualan menghitung biaya dua penginapan plus biaya upgrade untuk RESOR. Hibah Tak Terduga memberikan landmark tersedia secara acak. Perpindahan karena kartu tidak menerima gaji. Kartu lanjutan yang menargetkan aset hanya mengenai landmark atau bangunan milik warga yang menarik kartu. Jika asetnya lebih sedikit daripada jumlah sasaran, seluruh aset yang tersedia terkena efek.</p><h3>Masuk kembali & koneksi</h3><p>Simpan kunci masuk pribadimu melalui tombol \u201cKunci masuk\u201d. Kunci ini hanya untuk kursimu; bagikan kode ruang kepada teman, bukan kunci pribadi. Sesi tetap bertahan selama gangguan jaringan. Refresh dan membuka kembali website ini akan memulihkan ruang serta kursimu otomatis. Cookie dipakai di alamat server; penyimpanan browser dipakai saat HTML dipasang di website lain. Tombol Keluar menghentikan pemulihan otomatis. Untuk perangkat atau website lain, gunakan kode ruang dan kun   async function request(path,method='GET',data){if(!base)throw new Error('Alamat server belum disiapkan. Gunakan mode latihan dahulu.');const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),15000);try{const res=await fetch(base.replace(/\/$/,'')+path,{method,credentials:sameOrigin?'include':'omit',headers:{...(data?{'Content-Type':'application/json'}:{}),...(key?{Authorization:'Bearer '+key}:{})},body:data?JSON.stringify(data):undefined,signal:ctl.signal});const result=await res.json();if(!res.ok){const e=new Error(result.error||'Permintaan gagal.');e.status=res.status;e.result=result;throw e;}connection(true,'Meja tersambung');return result;}catch(e){if(e.name==='AbortError')throw new Error('Koneksi terlalu lama. Coba kembali.');throw e;}finally{clearTimeout(timeout);}}

  function followPiece(g,smooth=true){const scroller=$('.board-scroll'),board=$('.board');if(!scroller||!board)return;
    if(scroller.scrollWidth<=scroller.clientWidth&&scroller.scrollHeight<=scroller.clientHeight)return;

    const left=parseFloat(style.paddingLeft)||0,top=parseFloat(style.paddingTop)||0;
    scroller.scrollTo({left:Math.max(0,left+g.px/100*board.clientWidth-scroller.clientWidth/2),top:Math.max(0,top+g.py/100*board.clientHeight-scroller.clientHeight*(mobile?.17:.5)),behavior:smooth&&!reducedMotion()?'smooth':'instant'});

  async function playMotion(m){
    if(reducedMotion())return;
    const p=G.player(state,m.player),piece=[...document.querySelectorAll('[data-piece]')].find(e=>e.dataset.piece===m.player);if(!piece||!p)return;
    animating=true;document.querySelectorAll('[data-action]').forEach(e=>e.disabled=true);
    const live=$('.center-live');let diceTimer;
    try{
      if(m.dice){if(live)live.textContent=p.name+' mengocok dadu\u2026';visualDice([1,6],true);diceTimer=setInterval(()=>{const n=new Uint32Array(2);crypto.getRandomValues(n);visualDice([1+n[0]%6,1+n[1]%6],true);},110);await pause(DICE_DURATION);clearInterval(diceTimer);diceTimer=null;visualDice(m.dice,false);if(live)live.textContent='Dadu '+m.dice.join(' + ')+(m.dice[0]===m.dice[1]?' \u00b7 Kembar! Satu Kabar Nasib bonus.':'');await pause(450);}
      const place=id=>{const g=G.point(id);piece.style.left=g.px+'%';piece.style.top=g.py+'%';piece.setAttribute('aria-label','Bidak '+p.name+' di '+G.location(id).name);followPiece(g);document.querySelectorAll('.step-active').forEach(e=>e.classList.remove('step-active'));document.querySelector('.tile[data-tile="'+id+'"]')?.classList.add('step-active');};
      if(m.kind==='walk'){place(m.from);piece.classList.add('walking');for(const id of G.route(m.from,m.steps)){place(id);if(live)live.textContent=p.name+' berjalan ke '+G.location(id).name+'\u2026';await pause(STEP_DURATION);}piece.classList.remove('walking');}
      if(m.kind==='jump'||m.destination!==m.to){piece.style.transitionDuration='.65s';piece.classList.add('jumping');place(m.destination??m.to);if(live)live.textContent=p.name+' pindah ke '+G.location(m.destination??m.to).name+'\u2026';await pause(650);piece.classList.remove('jumping');}
      piece.classList.add('piece-arrival');await pause(300);$('#announcer').textContent=p.name+' tiba di '+G.location(m.destination??m.to).name+'.';
    }finally{clearInterval(diceTimer);rollingDice=false;animating=false;}
  }
  async function adopt(result){
    if(!result.state||animating||(state&&result.state.code===state.code&&result.state.version<state.version))return;
    you=result.you||you;if(result.key)key=result.key;const incoming=result.state,m=incoming.motion;
