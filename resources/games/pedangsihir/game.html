<style>
:root{--bg:#150f2e;--bg2:#1f1747;--card:#251c55;--line:rgba(255,255,255,.12);--ink:#f4f0ff;--mut:#b8acdf;--gold:#ffd23f;--pri:#b45cff;--teal:#22d3b6;--red:#ff4d6d;--k0:#ff8a1f;--k1:#b45cff;--k2:#3ea0ff;--r:18px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 80% -10%,#3b1f7a 0,transparent 60%),radial-gradient(900px 600px at -10% 30%,#10305e 0,transparent 60%),var(--bg);min-height:100vh}
a{color:#d8c2ff}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 12px;border-radius:8px;z-index:99}.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--mut)}.small{font-size:.88rem}
/* header */
.site-header{position:sticky;top:0;z-index:20;background:rgba(21,15,46,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#3b1f7a,#6d2bd9);box-shadow:0 0 0 2px rgba(255,255,255,.12) inset}
.brand-mark svg{width:26px;height:26px}
.brand strong{display:block;font-size:1.02rem;line-height:1.1;white-space:nowrap}.brand small{display:block;color:var(--mut);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-nav{display:flex;gap:18px;margin-left:auto}.site-nav a{color:var(--mut);text-decoration:none;font-weight:600}.site-nav a:hover{color:var(--ink)}
.conn{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:#3a2d6b;color:var(--mut);white-space:nowrap}
.conn[data-state=online]{background:#11463d;color:#7ff5dd}.conn[data-state=reconnecting]{background:#5b4310;color:#ffd98a}
@media (max-width:760px){.site-nav{display:none}.conn{margin-left:auto}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:14px;border:0;font-weight:800;text-decoration:none;cursor:pointer;background:#3a2d6b;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.primary{background:linear-gradient(180deg,#c47bff,#8b2fe0);color:#fff}
.btn.yellow{background:linear-gradient(180deg,#ffe066,#ffb703);color:#2a1600}
.btn.teal{background:linear-gradient(180deg,#4bf0d2,#13a88f);color:#032a23}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px var(--line) inset}
.btn.small{min-height:38px;padding:6px 14px;font-size:.92rem}.btn.tiny{min-height:30px;padding:3px 10px;font-size:.8rem;border-radius:10px;box-shadow:none}
.big-btn{font-size:1.08rem;min-height:54px;width:100%}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.08);font-size:1.1rem;cursor:pointer;flex:none}
/* hero */
.hero{padding:44px 0 28px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.eyebrow{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:rgba(255,210,63,.12);padding:4px 12px;border-radius:99px}
h1{font-size:clamp(2.1rem,5.2vw,3.6rem);line-height:1.05;margin:14px 0 12px;letter-spacing:-.02em;background:linear-gradient(90deg,#ffd98a,#ff8a1f 30%,#d38bff 62%,#7cc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.1rem;color:#ddd3ff;max-width:36em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}.facts li{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:.86rem;font-weight:600}
.hero-art{position:relative;aspect-ratio:1;max-width:430px;width:100%;margin:0 auto}
.hero-av{position:absolute;font-size:clamp(40px,7vw,64px);animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.hero-av.a1{left:-2%;top:2%}.hero-av.a2{right:-2%;top:2%;animation-delay:-1.2s;transform:scaleX(-1)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:300px}.hero{padding-top:26px}}
/* triangle */
.tri{position:relative;aspect-ratio:1;width:100%}
.tri-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tri .arr{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 5;animation:dash 1.4s linear infinite;opacity:.85}
.tri-node{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--k) 55%,#fff 0%),color-mix(in srgb,var(--k) 35%,#120b2b));box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 70%,#fff),0 0 26px color-mix(in srgb,var(--k) 60%,transparent);animation:nodeBob 3s ease-in-out infinite}
.tri-node svg{width:70%;height:70%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.tri-node.n1{animation-delay:-1s}.tri-node.n2{animation-delay:-2s}
.big-tri .tri-node{width:30%}
.tri.w0 .a0,.tri.w1 .a1,.tri.w2 .a2{stroke-width:6;opacity:1;animation:dash .35s linear infinite;filter:drop-shadow(0 0 4px #fff)}
.tri.w0 .n0,.tri.w1 .n1,.tri.w2 .n2{animation:nodeWin .9s ease-out}
/* sections + cards */
.section{padding:40px 0}.section.alt{background:rgba(0,0,0,.18);border-block:1px solid var(--line)}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0 0 16px;letter-spacing:-.01em}
.name-field{max-width:360px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--mut)}
.field input,.field select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#120c2b;padding:8px 12px;font-size:1rem;color:var(--ink);font-weight:600}
.field.grow{flex:1;min-width:120px}.small-field{width:auto}
.field-label{margin:10px 0 6px;font-size:.84rem;font-weight:700;color:var(--mut)}
.play-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
@media (max-width:1020px){.play-grid{grid-template-columns:1fr 1fr}.lb-card{grid-column:1/-1}}
@media (max-width:680px){.play-grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.card h3{margin:0 0 6px;font-size:1.25rem;display:flex;align-items:center;gap:8px}.card h3 .ic{font-size:1.4rem}
.cpu-card{border-color:rgba(255,210,63,.35);box-shadow:0 0 0 1px rgba(255,210,63,.12),0 18px 40px rgba(0,0,0,.25)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px}
.av-pick{display:flex;flex-wrap:wrap;gap:6px}
.av-btn{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);font-size:1.5rem;cursor:pointer;line-height:1}
.av-btn.on{border-color:var(--gold);background:rgba(255,210,63,.16);transform:scale(1.08)}
.hp-pick{display:flex;gap:8px}
.hp-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);cursor:pointer;font-size:1.05rem}
.hp-btn.on{border-color:var(--red);background:rgba(255,77,109,.16)}.hp-btn:disabled{cursor:default;opacity:.55}.hp-btn.on:disabled{opacity:1}
.hp-btn .hp{width:18px;height:17px}
.note{min-height:1.4em;margin:10px 0 0;font-size:.88rem;color:#a7f3e5}.note.err{color:#ffb3c1}
.rooms-h{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:.95rem}
.rooms{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.rooms li{font-size:.9rem}.rooms .room{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);padding:6px 6px 6px 12px;border-radius:12px}
.rooms .room b{letter-spacing:.12em}.rooms .room small{display:block;color:var(--mut);font-size:.78rem}
.lb{list-style:none;padding:0;margin:10px 0;counter-reset:lb;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:7px 12px;counter-increment:lb}
.lb li::before{content:counter(lb);font-weight:900;width:1.4em;color:var(--mut)}
.lb li:nth-child(1)::before{content:"🥇"}.lb li:nth-child(2)::before{content:"🥈"}.lb li:nth-child(3)::before{content:"🥉"}
.lb li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb li .sc{font-weight:900;color:var(--gold);font-size:1.1rem}.lb li small{color:var(--mut)}
.lb li.me{box-shadow:0 0 0 2px var(--gold) inset}
.lb .empty{justify-content:center;color:var(--mut)}.lb .empty::before{content:none}
/* rules */
.rules-grid{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
.mid-tri{max-width:300px;margin:0 auto}
@media (max-width:760px){.rules-grid{grid-template-columns:1fr}.mid-tri{max-width:240px}}
.beats{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.beats li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-left:5px solid var(--k);border-radius:14px;padding:10px 14px}
.beats p{margin:0 0 0 6px}.beats-arrow{font-size:1.4rem;color:var(--k);font-weight:900}
.steps{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:st}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media (max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px 16px;counter-increment:st}
.steps h3{margin:0 0 4px;font-size:1.05rem}.steps h3::before{content:counter(st);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-size:.85rem;margin-right:8px}
.steps p{margin:0;color:#d9d0fb;font-size:.94rem}
.foes{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.foes li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.foes .av{font-size:2rem;animation:bob 2.6s ease-in-out infinite}.foes li:nth-child(2n) .av{animation-delay:-1.3s}
.foes b{display:block}.foes small{color:var(--mut)}
/* icons */
.ki{display:inline-grid;place-items:center;vertical-align:middle;border-radius:50%;background:color-mix(in srgb,var(--k) 30%,#120b2b);box-shadow:0 0 0 2px color-mix(in srgb,var(--k) 80%,#fff)}
.ki svg{width:72%;height:72%}
.ki.big{width:54px;height:54px}.ki.mid{width:40px;height:40px}.ki.mini{width:20px;height:20px;box-shadow:none}.ki.sm{width:30px;height:30px}
/* footer */
.site-footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--mut);font-size:.9rem}
.site-footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}.site-footer p{margin:0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0d0820;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 30px);text-align:center}
/* ================= game screen ================= */
body.in-game{overflow:hidden;height:100dvh}
body.in-game .site-header,body.in-game .site-footer{display:none}
.game{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(900px 520px at 50% 52%,#3a1f78 0,transparent 70%),radial-gradient(600px 400px at 50% 110%,#123a6b 0,transparent 70%),var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
.game::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);background-size:46px 46px;opacity:.12;pointer-events:none;animation:drift 40s linear infinite}
.g-top{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none;max-width:1000px;width:100%;margin:0 auto;position:relative;z-index:2}
.g-info{flex:1;min-width:0;text-align:center;line-height:1.2}.g-info b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g-info span{font-size:.8rem}
.g-conn{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#5b4310;color:#ffd98a;animation:pulse 1s infinite}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1000px;width:100%;margin:0 auto;position:relative;z-index:1}
.opps{display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:4px 8px 0;flex:none}
.stage{flex:1;min-height:150px;position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
.stage .tri{height:100%;width:auto;max-width:100%;max-height:430px}
.stage .tri .tri-node{width:24%;opacity:.95}
.timer{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:clamp(62px,15vmin,104px);aspect-ratio:1;display:grid;place-items:center;pointer-events:none}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}.ring-bg{stroke:rgba(255,255,255,.12);fill:rgba(18,11,43,.75)!important}.ring-fg{stroke:var(--gold);stroke-dasharray:276.5;stroke-linecap:round;transition:stroke .2s}
.timer b{position:relative;font-size:clamp(24px,6vmin,40px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.timer.low .ring-fg{stroke:var(--red)}.timer.low b{color:#ffb3c1;animation:pulse .5s infinite}
.timer.idle .ring-fg{stroke:transparent}
.stage-msg{position:absolute;left:0;right:0;bottom:2px;margin:0;text-align:center;font-weight:800;font-size:clamp(.9rem,2.4vmin,1.15rem);text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
.game[data-ph=pick] .stage-msg{color:var(--gold)}
.coach{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:min(94%,460px);background:#fff8dc;color:#2a1600;border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5;display:flex;gap:10px;align-items:center}
.coach p{margin:0;font-weight:700;font-size:.95rem;line-height:1.35;flex:1}.coach .btn{color:#2a1600;background:rgba(0,0,0,.08);flex:none}
.coach::after{content:"";position:absolute;bottom:-9px;left:50%;border:10px solid transparent;border-top-color:#fff8dc;border-bottom:0;transform:translateX(-50%)}
.me-seat{flex:none;display:flex;justify-content:center;padding:2px 0 4px}
.watch-tag{font-weight:800;color:var(--mut);padding:16px}
/* seats */
.seat{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;flex:0 1 150px;--tok:64px}
.opps.n1 .seat{--tok:84px;flex-basis:200px}.opps.n3 .seat{--tok:58px}
.seat.me{--tok:88px;flex-direction:row;gap:12px;flex:none}
.seat.me .nm,.seat.me .hearts,.seat.me .st,.seat.me .tag{grid-column:2}
.seat.me{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto auto;align-items:center;column-gap:12px;row-gap:2px}
.seat.me .tok{grid-row:1/4}
.seat.me .nm{align-self:end}.seat.me .st{align-self:start;text-align:left}
.tok{position:relative;width:var(--tok);height:var(--tok);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 45%,#120b2b));box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 6px var(--c),0 10px 18px rgba(0,0,0,.45);transition:filter .3s,opacity .3s}
.face{font-size:calc(var(--tok)*.6);line-height:1;animation:bob 2.2s ease-in-out infinite;display:inline-block}
.seat:nth-child(2) .face{animation-delay:-.7s}.seat:nth-child(3) .face{animation-delay:-1.4s}
.pickb,.think{position:absolute;right:-12px;bottom:-8px;width:calc(var(--tok)*.55);height:calc(var(--tok)*.55);min-width:30px;min-height:30px;display:grid;place-items:center;animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
.pickb .ki,.think .ki{width:100%;height:100%}
.pickb:not(:has(.ki)){font-size:1.6rem;background:#120b2b;border-radius:50%;box-shadow:0 0 0 2px #fff}
.think{right:auto;left:-14px;bottom:auto;top:-10px;animation:think 1.2s ease-in-out infinite}
.think::after{content:"?";position:absolute;right:-4px;top:-6px;background:#fff;color:#2a1600;border-radius:50%;width:18px;height:18px;font-size:12px;font-weight:900;display:grid;place-items:center}
.nm{margin-top:9px;display:flex;align-items:center;gap:6px;max-width:100%;font-size:.88rem}
.nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seat.me .nm{margin-top:0;font-size:1.05rem}
.kamu{font-style:normal;font-size:.66rem;font-weight:900;background:var(--gold);color:#2a1600;padding:1px 6px;border-radius:6px;letter-spacing:.06em;flex:none}
.tag{font-size:.7rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hearts{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:calc(var(--tok) + 60px);margin-top:2px}
.seat.me .hearts{justify-content:flex-start;max-width:200px}
.hp{display:inline-block;width:15px;height:14px}.seat.me .hp{width:20px;height:18px}
.hp svg{width:100%;height:100%;display:block}.hp path{fill:rgba(255,255,255,.14)}.hp.on path{fill:#ff3d63;filter:drop-shadow(0 0 3px rgba(255,61,99,.7))}
.seat.low .hp.on{animation:pulse .7s infinite}
.st{min-height:1.2em;font-size:.74rem;font-weight:800;color:var(--mut);white-space:nowrap}
.seat.ready .tok{box-shadow:0 0 0 3px #fff,0 0 0 6px #22d3b6,0 0 22px #22d3b6}.seat.ready .st{color:#7ff5dd}
.seat.picking .face{animation:wobble 1s ease-in-out infinite}
.seat.lost .tok{opacity:.55}.seat.lost .st{color:#ffd98a}
.seat.ko .tok{filter:grayscale(1) brightness(.6);transform:rotate(-14deg) scale(.88);transition:transform .5s cubic-bezier(.3,1.6,.5,1),filter .5s}
.seat.ko .face{animation:none}.seat.ko .tok::after{content:"💀";position:absolute;font-size:calc(var(--tok)*.42);right:-6px;top:-8px;filter:none}
.seat.ko .st{color:var(--red)}
.seat.hit .tok{animation:hit .55s ease-out}
.seat.hit .tok::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:rgba(255,40,80,.55);animation:fade .55s forwards}
.seat.cheer .face{animation:cheer .75s ease-out}
.opps .seat.atk .tok{animation:lungeD .5s ease-out}.seat.me.atk .tok{animation:lungeU .5s ease-out}
.bubble{position:absolute;bottom:calc(100% - 10px);left:50%;transform:translateX(-50%);background:#fff;color:#1a1033;border-radius:14px;padding:5px 10px;font-weight:800;font-size:.82rem;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;z-index:6;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.opps .bubble{bottom:auto;top:calc(var(--tok) - 6px)}
.seat.me .bubble{left:calc(var(--tok) / 2);bottom:calc(100% - 4px)}
.bubble.emo{font-size:1.9rem;padding:2px 8px;background:rgba(255,255,255,.95)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:#fff;transform:translateX(-50%)}
.opps .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
/* skills + emoji bar */
.g-bottom{flex:none;max-width:760px;width:100%;margin:0 auto;padding:4px 10px 8px;position:relative;z-index:3}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:92px;padding:6px 4px;border-radius:20px;border:0;cursor:pointer;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--k) 85%,#fff 15%),color-mix(in srgb,var(--k) 60%,#120b2b));box-shadow:0 6px 0 color-mix(in srgb,var(--k) 40%,#000),0 10px 20px rgba(0,0,0,.35);transition:transform .1s,opacity .2s,filter .2s}
.sk-ic{width:50px;height:50px;display:grid;place-items:center}.sk-ic svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.sk b{font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.3);line-height:1.1}
.sk-hint{display:flex;align-items:center;gap:2px;font-size:.7rem;opacity:.9}
.sk kbd{position:absolute;top:6px;left:8px;font:800 .7rem system-ui;opacity:.6;display:none}
@media (pointer:fine){.sk kbd{display:block}}
.sk:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--k) 40%,#000)}
.sk:disabled{cursor:default}
.skills.off .sk{opacity:.45;filter:saturate(.5)}
.sk.sel{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 30px var(--k),0 6px 0 color-mix(in srgb,var(--k) 40%,#000)}
.sk.sel::after{content:"✓";position:absolute;top:-10px;right:-6px;width:28px;height:28px;border-radius:50%;background:#22d3b6;color:#032a23;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.sk.dim{opacity:.3;filter:grayscale(.7)}
.sk.hint{animation:hintPulse 1s ease-in-out infinite}
.skills.pulse .sk{animation:skIn .45s cubic-bezier(.2,1.6,.4,1) both}.skills.pulse .sk:nth-child(2){animation-delay:.05s}.skills.pulse .sk:nth-child(3){animation-delay:.1s}
.emos{display:flex;justify-content:center;gap:6px;margin-top:8px}
.emo{width:42px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.08);font-size:1.3rem;cursor:pointer;line-height:1}
.emo:active{transform:scale(.9)}
.game.demo .g-top .icon-btn#muteBtn{visibility:hidden}
.chat{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 66px);transform:translateX(-50%);width:min(94vw,420px);background:#1d1544;border:1px solid var(--line);border-radius:18px;padding:10px;z-index:8;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.chat-head .icon-btn{width:34px;height:34px}
.chat-quick{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:99px;padding:7px 12px;background:rgba(255,255,255,.1);cursor:pointer;font-weight:700;font-size:.85rem}
.chat-form{display:flex;gap:6px;margin-top:8px}.chat-form input{flex:1;min-width:0;min-height:40px;border-radius:12px;border:1px solid var(--line);background:#120c2b;padding:6px 10px;color:var(--ink)}
/* banners (announcer) */
.banners{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:9;padding-bottom:10vh}
.ban{text-align:center;animation:banIn 1.7s cubic-bezier(.2,1.3,.4,1) both}
.ban b{display:block;font-weight:900;font-size:clamp(40px,11vw,96px);line-height:1;letter-spacing:.02em;color:#fff;-webkit-text-stroke:2px rgba(40,10,40,.85);paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,255,255,.35)}
.ban small{display:block;margin-top:6px;font-weight:800;font-size:clamp(14px,3.6vw,22px);text-shadow:0 2px 6px rgba(0,0,0,.8)}
.ban.small b{font-size:clamp(26px,7vw,52px)}
.ban.k0 b{color:#ffb15c}.ban.k1 b{color:#dba6ff}.ban.k2 b{color:#8cc8ff}.ban.draw b{color:#e6e0ff}
.ban.ann b{background:linear-gradient(180deg,#fffbe0,#ffd23f 45%,#ff6a2b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 4px 0 #5a1208) drop-shadow(0 0 18px rgba(255,140,40,.6))}
.ban.ann.firstblood b{background-image:linear-gradient(180deg,#ffe0e0,#ff3b4f 50%,#8e0016);filter:drop-shadow(0 4px 0 #3d0008) drop-shadow(0 0 20px rgba(255,40,60,.7))}
.ban.ann.double b,.ban.ann.triple b,.ban.ann.quad b{background-image:linear-gradient(180deg,#fff,#ff7ce6 40%,#8a2bff)}
.ban.ann.legend b,.ban.ann.savage b,.ban.ann.maniac b{background-image:linear-gradient(90deg,#ff8a1f,#ffd23f,#22d3b6,#3ea0ff,#b45cff);background-size:200% 100%;animation:rainbow 1s linear infinite}
.ban.ann.win b{font-size:clamp(52px,14vw,120px);background-image:linear-gradient(180deg,#fffbe0,#ffd23f 50%,#ff9f1c)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--fc,#fff);z-index:7;mix-blend-mode:screen}
.flash.on{animation:flash .45s ease-out}
.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:35;display:none}
body.in-game .fx{display:block}
/* overlay */
.ov{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(10,6,28,.62);backdrop-filter:blur(4px)}
.ov-card{width:min(100%,440px);max-height:calc(100dvh - 28px);overflow:auto;background:linear-gradient(180deg,#2c2163,#1d1544);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
.ov-card h2{margin:4px 0 8px;font-size:1.5rem}.ov-card p{margin:6px 0}
.ov-card.small{width:min(100%,360px)}
.ov-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}.ov-actions .btn{min-width:130px}
.trophy{font-size:3.4rem;line-height:1;animation:cheer 1.2s ease-in-out infinite}
.big-n{font-size:3rem;font-weight:900;color:var(--gold);line-height:1.1}
.foe-next{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}.foe-next .av{font-size:3rem;animation:bob 2s infinite}.foe-next b{display:block;font-size:1.2rem}

  onOut(id, gone) {

  wake() { this.room.refresh().catch(onlineError); }
  tick() { const r = this.room; if (r.amAlive()) r.notice(document.hidden); else if (r.awayNote && !document.hidden) r.notice(false); r.tick(); }
  lobbyHTML(d) {
    const r = this.room, s = r.s, list = N.seated(d.players), need = Math.max(0, 2 - list.length), specs = d.players.filter(p => p.spectator).length, host = r.isHost(), hp = s.settings ? s.settings.hp : 5;
    const avOf = id => (s.avs.find(x => x[0] === id) || [])[1], mine = avOf(r.me);

    html += '<p class="muted small">' + esc(t('lobbyCount', { n: list.length, max: d.maxPlayers }) + (specs ? ' · ' + t('spectatorsCount', { n: specs }) : '')) + '</p>';

    html += '<p class="muted small">' + esc(need ? t('lobbyNeed', { n: need }) : (host ? t('lobbyHostHint') : t('lobbyWaitHost'))) + '</p></div>';

  }
  overlay() {

    }
    if (ph === 'playing' && this.outCard) return '<div class="ov-card small out-card"><h2>' + esc(t('outTitle')) + '</h2><p>' + esc(t('outText')) + '</p><div class="ov-actions"><button type="button" class="btn primary" data-act="watch">' + esc(t('watchRest')) + '</button><button type="button" class="btn ghost" data-act="leave">' + esc(t('exit')) + '</button></div></div>';

  }
  overlayAct(a, b) {
    const r = this.room;
    if (a === 'start') r.start(AVS).catch(e => toast(errMsg(e)));
    else if (a === 'av') { myAv = b.dataset.av; local.set('pedangsihir.av', myAv); r.pickAv(myAv).catch(e => toast(errMsg(e))); }
    else if (a === 'hp') { pickedHp = P.cleanHp(b.dataset.hp); local.set('pedangsihir.hp', String(pickedHp)); r.setHp(pickedHp).catch(e => toast(errMsg(e))); }

}
/* ----- home: online card ----- */
let onlineState = 'off', roomsTimer = 0, roomsAt = 0, roomList = [];
const ROOM_STALE_MS = 90000;
function setOnline(state, msg, isErr) { onlineState = state; document.querySelectorAll('.online-btn').forEach(b => { b.disabled = state !== 'ready'; }); note(msg || '', isErr); updateConn(); }
function note(msg, isErr) { const n = $('onlineNote'); n.textContent = msg; n.classList.toggle('err', !!isErr); }
function updateConn() {
  const c = $('conn'); let st = 'offline', label = t('connOffline');
  if (net.config && !net.stopped) { if (net.state === 'online') { st = 'online'; label = t('connOnline'); } else if (net.state === 'reconnecting') { st = 'reconnecting'; label = t('connReconnecting'); } else { st = 'reconnecting'; label = t('connConnecting'); } }
  c.dataset.state = st; c.textContent = label;
  const g = $('gConn'), show = !!(mode && mode.kind === 'online') && st !== 'online'; g.hidden = !show; if (show) g.textContent = st === 'offline' ? t('connOffline') : t('connLost');
}
function scheduleRooms() { if ($('home').hidden) return; clearTimeout(roomsTimer); roomsTimer = setTimeout(loadRooms, Math.max(0, 1500 - (Date.now() - roomsAt))); }
async function loadRooms() {
  if (onlineState !== 'ready' || $('home').hidden) { renderRooms(); return; }
  roomsAt = Date.now();
  try { const r = await net.rooms(); roomList = (r && Array.isArray(r.rooms)) ? r.rooms : []; } catch (e) { if (e.code !== 'busy') roomList = []; }
  renderRooms();
}
/** rooms nobody has touched for a while (host gone, tab frozen) are hidden: live rooms write at least every 10 s */
const freshRoom = r => { const u = Date.parse(r.updatedAt || ''); return !Number.isFinite(u) || net.serverNow() - u < ROOM_STALE_MS; };
function renderRooms() {
  const el = $('rooms');
  if (onlineState !== 'ready') { el.innerHTML = ''; return; }
  const list = roomList.filter(freshRoom);
  if (!list.length) { el.innerHTML = '<li class="muted">' + esc(t('roomsEmpty')) + '</li>'; return; }
  el.innerHTML = list.map(r => { const open = r.status === 'waiting' && r.seated < r.maxPlayers; return '<li class="room"><span><b>' + esc(r.code) + '</b><small>' + esc((r.status === 'waiting' ? t('roomWaiting') : t('roomPlaying')) + ' · ' + t('roomSeats', { n: r.seated, max: r.maxPlayers })) + '</small></span><button type="button" class="btn small ' + (open ? 'teal' : 'ghost') + '" data-room="' + esc(r.code) + '" data-kind="' + (open ? 'join' : 'watch') + '">' + esc(open ? t('join') : t('watch')) + '</button></li>'; }).join('');
}
$('rooms').addEventListener('click', e => { const b = e.target.closest('[data-room]'); if (!b) return; $('codeInput').value = b.dataset.room; go(b.dataset.kind, b.dataset.room); });
let entering = false;
function joinFail(e) { return { ok: false, missing: e.status === 404 || e.status === 422, retry: e.code === 'network' || e.code === 'busy' || e.status === 429, message: errMsg(e) }; }
async function go(kind, code) {
  if (entering || onlineState !== 'ready') return { ok: false, retry: true };
  const name = $('nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 24);
  if (!name) { note(t('errName'), true); $('nameInput').focus(); return { ok: false, retry: true, message: t('errName') }; }
  if ((kind === 'join' || kind === 'watch') && !/^[A-Z2-9]{6}$/.test(code || '')) { note(t('errCode'), true); $('codeInput').focus(); return { ok: false, missing: true }; }
  local.set('pedangsihir.name', name); entering = true; document.querySelectorAll('.online-btn').forEach(b => { b.disabled = true; });
  const m = new OnlineMatch(), opts = { displayName: name, code, maxPlayers: Math.max(2, Math.min(4, Number($('maxSelect').value) || 4)), settings: { hp: pickedHp } };
  const afterEnter = () => { note(''); showGame(m); if (!m.spectator() && m.room.s.phase !== 'playing') m.room.pickAv(myAv).catch(() => { /* pick again in the lobby */ }); };
  try { await m.room.enter(kind, opts); afterEnter(); return { ok: true }; }
  catch (e) {

      try { await m.room.enter('watch', opts); toast(t('nowWatching')); afterEnter(); return { ok: true }; } catch (e2) { note(errMsg(e2), true); return joinFail(e2); }
    } else { note(errMsg(e), true); return joinFail(e); }

$('createPrivate').addEventListener('click', () => go('private'));
$('quickMatch').addEventListener('click', () => go('match'));
$('joinForm').addEventListener('submit', e => { e.preventDefault(); go('join', $('codeInput').value.trim().toUpperCase()); });
$('watchBtn').addEventListener('click', () => go('watch', $('codeInput').value.trim().toUpperCase()));
$('refreshRooms').addEventListener('click', loadRooms);
$('codeInput').addEventListener('input', e => { const el = e.target, v = el.value.toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 6); if (v !== el.value) el.value = v; });
const saveName = () => { const n = $('nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 24); if (n) local.set('pedangsihir.name', n); };
$('ladderStart').addEventListener('click', () => { saveName(); startLocal({ kind: 'ladder' }); });
$('partyStart').addEventListener('click', () => { saveName(); startLocal({ kind: 'party' }); });
$('tutorialStart').addEventListener('click', () => { saveName(); startLocal({ kind: 'tut' }); });
/* ----- game screen input ----- */
$('skills').addEventListener('click', e => { const b = e.target.closest('.sk'); if (b && mode) mode.pick(Number(b.dataset.k)); });
document.addEventListener('keydown', e => { if (!mode || e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test((e.target && e.target.tagName) || '')) return; const k = '123'.indexOf(e.key); if (k >= 0) { mode.pick(k); e.preventDefault(); } else if (e.key === 'Escape' && !$('chat').hidden) $('chat').hidden = true; });
$('emoBar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !mode) return; if (b.id === 'chatBtn') { const c = $('chat'); c.hidden = !c.hidden; b.setAttribute('aria-expanded', String(!c.hidden)); if (!c.hidden && matchMedia('(pointer: fine)').matches) $('chatInput').focus(); return; } if (b.dataset.emo) mode.emo(b.dataset.emo); });
$('chatQuick').addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (!b || !mode) return; mode.say(b.dataset.say); $('chat').hidden = true; });
$('chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('chatInput').value; if (!mode || !N.cleanText(v)) return; mode.say(v); $('chatInput').value = ''; $('chat').hidden = true; });
$('chatClose').addEventListener('click', () => { $('chat').hidden = true; });
$('exitBtn').addEventListener('click', () => { if (mode) mode.exit(); });
$('muteBtn').addEventListener('click', () => { const m = SFX.toggle(); $('muteBtn').textContent = m ? '🔇' : '🔊'; $('muteBtn').setAttribute('aria-label', t(m ? 'unmute' : 'mute')); });
$('tutSkip').addEventListener('click', () => { if (mode && mode.skipTut) mode.skipTut(); });
$('ov').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || !mode || b.disabled) return; SFX.play('click'); mode.overlayAct(b.dataset.act, b); });
$('brandLink').addEventListener('click', e => { if (mode) { e.preventDefault(); mode.exit(); } });
function route() { const h = location.hash.toLowerCase(); if (mode) return; if (h === '#latihan' || h === '#cpu') startLocal({ kind: 'ladder' }); else if (h === '#demo') startLocal({ kind: 'demo', bots: 3, hp: 5 }); }
window.addEventListener('hashchange', route);
/* ---------------- boot ---------------- */
$('nameInput').value = local.get('pedangsihir.name') || '';
applyText();
setInterval(() => { if (mode) mode.tick(); }, 250);
const invite = window.JRInvite ? JRInvite.code('room') : '';
route();
async function resumeSaved() { const m = new OnlineMatch(); try { await m.room.resume(); if (!mode) showGame(m); } catch (e) { if (e.status === 403 || e.status === 404) net.forget(); } }
const onlineReady = (async function initOnline() {
  if (!net.allowed) { setOnline('off', t('errOffline')); return 'offline'; }
  setOnline('checking', t('onlineChecking'));
  try {
    await net.start(); setOnline('ready', t('onlineReady')); loadRooms();
    if (net.code && net.token && !mode && (!invite || invite === net.code)) await resumeSaved();
    return 'ready';
  } catch (e) { const key = e.code === 'disabled' ? 'errDisabled' : e.code === 'mismatch' ? 'errMismatch' : 'errNetwork'; setOnline('off', t(key), true); return t(key); }
})();
// invite link (?room=CODE): the room exists → only ask for a name and join; missing → main menu with a short notice
if (invite) JRInvite.run({
  code: invite, lang: 'id', gameName: (CFG.site && CFG.site.name) || '', nameKey: 'pedangsihir.name', nameMax: 24, accent: '#b45cff',
  check: async c => { const st = await onlineReady; if (st === 'offline') return 'offline'; if (st !== 'ready') return { fallback: st }; if (mode && mode.kind === 'online' && net.code === c) return 'session'; return net.probe(c); },
  join: name => { $('nameInput').value = name; $('codeInput').value = invite; return go('join', invite); },
  fallback: msg => { $('codeInput').value = ''; if (msg) note(msg, true); if (!mode) { const p = $('play'); if (p) p.scrollIntoView({ block: 'start' }); if (net.code && net.token && onlineState === 'ready') resumeSaved(); } }
});
window.addEventListener('online', () => { if (onlineState === 'ready') net.visible(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && onlineState === 'ready') net.visible(); if (mode && mode.kind === 'online') mode.tick(); });
/* closing the tab / navigating away (back, Game Hub, reload): best-effort keepalive leave. The server drops me from the

let leftByPagehide = false;
window.addEventListener('pagehide', () => { if (mode && mode.kind === 'online' && mode.room.data && mode.room.data.status !== 'closed') { leftByPagehide = mode.room.leaveNow(); } });
window.addEventListener('pageshow', e => { if (e.persisted && leftByPagehide) { leftByPagehide = false; if (mode && mode.kind === 'online') { showHome(); toast(t('leftRoom')); } } });

})();
