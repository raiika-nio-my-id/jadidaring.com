# Micro-cache for anonymous public pages. Only responses that PHP itself marks `Cache-Control: public, max-age=N`
# (and that carry no Set-Cookie) are stored, so logged-in/CSRF pages stay uncached. Requests with a session
# cookie bypass the cache. Keys live in a 2 MB zone; bodies are capped at 40 MB on disk.
fastcgi_cache_path /tmp/jd-cache levels=1:2 keys_zone=jdpublic:2m max_size=40m inactive=30m use_temp_path=off;
map $http_cookie $jd_skip_cache {
    default 0;
    ~*singlepage-session 1;
    ~*remember_web_ 1;
    ~*XSRF-TOKEN 1;
}

server {
    listen 80;
    index index.php index.html;
    absolute_redirect off;
    port_in_redirect off;
    root /var/www/public;

    client_max_body_size 50M;

    # Docker's embedded DNS. Variables are resolved per request so a reload can
    # move PHP to another container, and a replaced Reverb container is picked
    # up without recreating nginx. valid=2s caps the stale window after that.
    resolver 127.0.0.11 ipv6=off valid=2s;

    # Ships as a symlink to upstream.default.conf. Path B rewrites the file
    # (already visible via the app bind mount) and reloads. No second public port.
    include /var/www/.deploy/nginx-upstream.conf;

    # Laravel Reverb, one websocket for every game subdomain. Forge-style proxy:
    # browsers use /app, the app publishes events to /apps.
    location /app {
        set $game_ws $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Every request on these paths is a WebSocket handshake. The proxy in front of
        # this stack drops the Upgrade header, so it is set explicitly here.
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://$game_ws;
    }

    # Rust realtime engine: browsers connect to /rt/app/{key}?t=<signed token>.
    # Only the WebSocket path is exposed; /health and the publish API stay internal.
    location /rt/app/ {
        set $rt_ws singlepage-realtime:9000;
        rewrite ^/rt/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Every request on these paths is a WebSocket handshake. The proxy in front of
        # this stack drops the Upgrade header, so it is set explicitly here.
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://$rt_ws;
    }

    # Rust realtime over Server-Sent Events (works when the proxy in front of the
    # stack does not tunnel WebSockets). Long-lived streaming responses.
    location /rt/sse/ {
        set $rt_sse singlepage-realtime:9000;
        rewrite ^/rt/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Tell the proxy in front of this stack not to buffer the stream (nginx hides
        # the upstream X-Accel-Buffering header, so it is added again here).
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://$rt_sse;
    }

    location /apps {
        set $game_api $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://$game_api;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Unique container name — do not use a shared service name like "app".
        # $php_upstream is host:port (see the included upstream file).
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_cache jdpublic;
        fastcgi_cache_key "v2$host$request_uri";
        fastcgi_cache_bypass $jd_skip_cache;
        fastcgi_no_cache $jd_skip_cache;
        fastcgi_cache_lock on;
        fastcgi_cache_use_stale updating error timeout http_500 http_503;
        add_header X-Cache $upstream_cache_status always;
        # Fall back when global-proxy omits forwarded headers (empty values break Laravel URL generation)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
