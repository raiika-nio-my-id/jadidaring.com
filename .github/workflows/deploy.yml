name: Deploy to Production

# ── Triggers ──────────────────────────────────────────────────────────────────
# 1. Automatic: every push to main (skips docs-only changes).
# 2. Manual:    "Run workflow" button in the GitHub Actions UI.
on:
  push:
    branches: [main]
    # Empty commits do not run this workflow: with paths-ignore GitHub
    # treats a no-file-change push as unmatched and skips the job.
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (defaults to main)'
        required: false
        default: 'main'
        type: string
      deployer_name:
        description: 'Name of the person who triggered the deploy'
        required: false
        default: ''
        type: string
      maintenance:
        description: 'artisan down for a breaking schema change'
        required: false
        default: false
        type: boolean
      force_recreate:
        description: 'Force a blue-green container replace'
        required: false
        default: false
        type: boolean
      restart_reverb:
        description: 'Recreate Reverb after the deploy (WebSocket clients reconnect)'
        required: false
        default: false
        type: boolean

# ── Safety: only one deploy at a time ─────────────────────────────────────────
# A second run queues (cancel-in-progress: false) rather than clobbering the
# first. Change to true if you'd prefer to cancel the running deploy instead.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── CI gate ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip, bcmath

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: php vendor/bin/phpunit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS tests
        run: node --test tests/js/*.cjs

  # ── Rust realtime binary ─────────────────────────────────────────────────────
  # Built here (static musl) so the 1 GB host never compiles Rust.
  realtime:
    name: Build realtime (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup target add x86_64-unknown-linux-musl && sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            realtime/target
          key: cargo-${{ hashFiles('realtime/Cargo.lock') }}
      - name: Unit tests
        working-directory: realtime
        run: cargo test --locked
      - name: Release build
        working-directory: realtime
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: jd-realtime
          path: realtime/target/x86_64-unknown-linux-musl/release/jd-realtime
          retention-days: 7

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    # On push: "Deploy main (by octocat)"
    # On workflow_dispatch with deployer_name: "Deploy main (by Alice)"
    # On workflow_dispatch without deployer_name: "Deploy feature/x (by octocat)"
    name: >-
      Deploy ${{ inputs.ref || github.ref_name }}
      (by ${{ inputs.deployer_name || github.actor }})
    runs-on: ubuntu-latest
    needs: [test, realtime]

    # Optional: pin an environment for approval gates / environment secrets.
    # environment: production

    steps:
      - name: Validate ref
        run: |
          # On push triggers inputs.ref is empty; fall back to the pushed branch name.
          REF="${{ inputs.ref || github.ref_name }}"
          if [[ ! "$REF" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
            echo "::error::Invalid ref: '$REF'. Only alphanumeric characters, dots, slashes, underscores, and dashes are allowed."
            exit 1
          fi

      - name: Download realtime binary
        uses: actions/download-artifact@v4
        with:
          name: jd-realtime
          path: realtime-dist

      - name: Upload realtime binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: realtime-dist/jd-realtime
          target: ${{ secrets.DEPLOY_PATH || '/var/www/jadidaring.com' }}/realtime/incoming
          strip_components: 1
          overwrite: true

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # inputs.ref is empty on push triggers; github.ref_name is the pushed branch.
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REPO: ${{ github.repository }}
          # Push events have no inputs; both expressions are 0 unless the
          # workflow_dispatch checkbox is set.
          DEPLOY_MAINTENANCE: ${{ inputs.maintenance && '1' || '0' }}
          DEPLOY_FORCE_RECREATE: ${{ inputs.force_recreate && '1' || '0' }}
          DEPLOY_RESTART_REVERB: ${{ inputs.restart_reverb && '1' || '0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # DEPLOY_PORT is optional; leave unset to use the default (22).
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # SHA256 host-key fingerprint of the server.
          # Obtain on the server with:
          #   ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | awk '{print $2}'
          # Output looks like: SHA256:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_REF,DEPLOY_PATH,DEPLOY_REPO,DEPLOY_MAINTENANCE,DEPLOY_FORCE_RECREATE,DEPLOY_RESTART_REVERB
          # Bootstrap: fetch first so scripts/deploy.sh is available even on the
          # first run (the server checkout may not yet contain the script).
          # Piping from origin/$DEPLOY_REF guarantees the server always runs the
          # same version of deploy.sh that is in the target ref. That script
          # chooses Path A (bind-mounted code) or Path B (blue-green).
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_PATH:-/var/www/jadidaring.com}"
            cd "$APP_DIR"
            # Containers belong to compose project "singlepage" (pre-rename folder name).
            export COMPOSE_PROJECT_NAME=singlepage
            # Keep the server checkout's origin on this repository (it was renamed);
            # keep the transport (ssh deploy key vs https) the checkout already uses.
            cur_origin="$(git config --get remote.origin.url || true)"
            case "$cur_origin" in
              git@*|ssh://*) want_origin="git@github.com:${DEPLOY_REPO}.git" ;;
              *) want_origin="https://github.com/${DEPLOY_REPO}.git" ;;
            esac
            if [ "$cur_origin" != "$want_origin" ]; then
              git remote set-url origin "$want_origin"
              echo "==> origin set to $want_origin"
            fi
            # Swap in the new realtime binary atomically; restart only when it changed.
            if [ -f realtime/incoming/jd-realtime ]; then
              mkdir -p realtime/bin
              chmod 755 realtime/incoming/jd-realtime
              if ! cmp -s realtime/incoming/jd-realtime realtime/bin/jd-realtime; then
                cp realtime/incoming/jd-realtime realtime/bin/jd-realtime.new
                mv -f realtime/bin/jd-realtime.new realtime/bin/jd-realtime
                docker restart singlepage-realtime >/dev/null 2>&1 || true
                echo "==> realtime binary updated"
              fi
              rm -f realtime/incoming/jd-realtime
            fi
            echo "==> Fetching latest refs from origin..."
            git fetch --prune --tags origin
            echo "==> Running scripts/deploy.sh @ origin/${DEPLOY_REF}"
            args=( "${DEPLOY_REF}" )
            if [ "${DEPLOY_MAINTENANCE:-0}" = "1" ]; then
              args+=( --maintenance )
            fi
            if [ "${DEPLOY_FORCE_RECREATE:-0}" = "1" ]; then
              args+=( --force-recreate )
            fi
            if [ "${DEPLOY_RESTART_REVERB:-0}" = "1" ]; then
              args+=( --restart-reverb )
            fi
            git show "origin/${DEPLOY_REF}:scripts/deploy.sh" | bash -s -- "${args[@]}"

  # ── Smoke test ──────────────────────────────────────────────────────────────
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for app startup
        run: sleep 10

      - name: Smoke /up
        run: |
          curl --retry 5 --retry-delay 6 --retry-all-errors \
            -sSf -o /dev/null -w 'HTTP %{http_code}\n' \
            https://jadidaring.com/up

      - name: Smoke /drawquarium/api/game/config
        run: |
          curl --retry 5 --retry-delay 6 --retry-all-errors \
            -sSf -o /dev/null -w 'HTTP %{http_code}\n' \
            https://jadidaring.com/game/drawquarium/api/game/config

      - name: Smoke home and game hub
        run: |
          for path in / /game /berita; do
            curl --retry 5 --retry-delay 6 --retry-all-errors \
              -sSf -o /dev/null -w "$path HTTP %{http_code}\n" \
              "https://jadidaring.com$path"
          done

      - name: Smoke login page
        run: |
          curl --retry 5 --retry-delay 6 --retry-all-errors \
            -sSf -o /dev/null -w 'HTTP %{http_code}\n' \
            https://jadidaring.com/masuk
          curl --retry 5 --retry-delay 6 --retry-all-errors \
            -sSf -o /dev/null -w 'admin login HTTP %{http_code}\n' \
            https://jadidaring.com/admin/masuk

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            PREVIOUS_SHA="${{ github.event.before }}"
            # Only rollback on push events with a valid previous SHA
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "Skipping rollback: not a push event (event=${{ github.event_name }})"
              exit 0
            fi
            if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "Skipping rollback: no valid previous SHA"
              exit 0
            fi
            cd "${{ secrets.DEPLOY_PATH || '/var/www/jadidaring.com' }}"
            export COMPOSE_PROJECT_NAME=singlepage
            git fetch --prune --tags origin
            echo "==> Rolling back to $PREVIOUS_SHA"
            git show "origin/main:scripts/deploy.sh" | bash -s -- "$PREVIOUS_SHA"

      - name: Tag release
        if: success()
        run: |
          TAG="release-$(date -u '+%Y%m%d-%H%M%S')"
          echo "Tagging ${{ github.sha }} as $TAG"
          git_url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git init --bare _tag_repo
          cd _tag_repo
          git remote add origin "$git_url"
          git fetch origin "${{ github.sha }}" --depth=1
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
