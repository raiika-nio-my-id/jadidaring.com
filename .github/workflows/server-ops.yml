name: Server ops (env keys, test-user cleanup)

# Manual only. Whitelisted actions; secret values come from repo secrets and are never echoed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action
        required: true
        type: choice
        options: [set-ga4, set-google-stats, set-google-oauth, set-github-oauth, set-telegram, set-mail, mail-test, delete-test-user, backfill-email-normalized, merge-langit-dry, merge-langit]
      value:
        description: "set-ga4: measurement id (G-XXXX). set-google-stats: optional Search Console site (sc-domain:jadidaring.com or https://jadidaring.com/). delete-test-user: username (tmp + digits only)"
        required: false
        type: string

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          ACTION: ${{ inputs.action }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$ACTION" in
            set-ga4) [[ "$VALUE" =~ ^G-[A-Z0-9]{4,20}$ ]] || { echo "bad GA4 id"; exit 1; } ;;
            merge-langit-dry|merge-langit) [[ "$VALUE" =~ ^[A-Z0-9]{4,12}$ ]] || { echo "room code required"; exit 1; } ;;
            mail-test) [[ "$VALUE" =~ ^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}$ ]] || { echo "bad email"; exit 1; } ;;
            delete-test-user) [[ "$VALUE" =~ ^tmp[0-9]{3,20}$ ]] || { echo "username must match tmp<digits>"; exit 1; } ;;
            set-google-stats) [[ -z "$VALUE" || "$VALUE" =~ ^sc-domain:[a-z0-9.-]+$ || "$VALUE" =~ ^https://[a-z0-9.-]+/$ ]] || { echo "bad Search Console site"; exit 1; } ;;
          esac
      - name: Prepare Google stats key
        if: inputs.action == 'set-google-stats'
        env:
          PROP_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SA_JSON: ${{ secrets.GOOGLE_STATS_SA_JSON }}
        run: |
          set -euo pipefail
          [[ "$PROP_ID" =~ ^[0-9]{6,15}$ ]] || { echo "secret GA4_PROPERTY_ID missing or not numeric"; exit 1; }
          printf '%s' "$SA_JSON" | jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | contains("PRIVATE KEY"))' >/dev/null 2>&1 \
            || { echo "secret GOOGLE_STATS_SA_JSON missing or not a service account JSON key"; exit 1; }
          b64="$(printf '%s' "$SA_JSON" | jq -c . | base64 -w0)"
          echo "::add-mask::$b64"
          echo "SA_B64=$b64" >> "$GITHUB_ENV"
          echo "key and property id look valid"
      - name: Run on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ACTION: ${{ inputs.action }}
          VALUE: ${{ inputs.value }}
          G_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TG_USER: ${{ secrets.TG_BOT_USERNAME }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          M_USER: ${{ secrets.MAIL_USERNAME }}
          M_PASS: ${{ secrets.MAIL_PASSWORD }}
          GS_PROP: ${{ secrets.GA4_PROPERTY_ID }}
          GS_KEY: ${{ env.SA_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,ACTION,VALUE,G_ID,G_SECRET,GH_ID,GH_SECRET,TG_USER,TG_TOKEN,M_USER,M_PASS,GS_PROP,GS_KEY
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            setkey() {
              # Rewrite in place (same inode) so the bind-mounted .env stays valid.
              local k="$1" v="$2" tmp; tmp="$(mktemp)"
              { grep -v "^${k}=" .env || true; printf '%s=%s\n' "$k" "$v"; } > "$tmp"
              cat "$tmp" > .env; rm -f "$tmp"
            }
            case "$ACTION" in
              set-google-stats)
                [ -n "$GS_PROP" ] && [ -n "$GS_KEY" ] || { echo "missing GA4_PROPERTY_ID or key"; exit 1; }
                cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                setkey GA4_PROPERTY_ID "$GS_PROP"
                setkey GOOGLE_STATS_SA_JSON_B64 "$GS_KEY"
                if [ -n "$VALUE" ]; then setkey GSC_SITE_URL "$VALUE"; fi
                ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                docker exec singlepage-app php artisan config:clear --no-ansi
                docker exec singlepage-app php artisan cache:clear --no-ansi || true
                # Names only, never values.
                for k in GA4_PROPERTY_ID GOOGLE_STATS_SA_JSON_B64 GSC_SITE_URL; do
                  if grep -q "^${k}=.\+" .env; then echo "$k: set"; else echo "$k: not set (default)"; fi
                done
                ;;
              set-ga4|set-google-oauth|set-github-oauth|set-telegram|set-mail)
                cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                if [ "$ACTION" = set-ga4 ]; then setkey GA4_MEASUREMENT_ID "$VALUE"
                elif [ "$ACTION" = set-github-oauth ]; then setkey GITHUB_CLIENT_ID "$GH_ID"; setkey GITHUB_CLIENT_SECRET "$GH_SECRET"
                elif [ "$ACTION" = set-telegram ]; then setkey TELEGRAM_BOT_USERNAME "$TG_USER"; setkey TELEGRAM_BOT_TOKEN "$TG_TOKEN"
                elif [ "$ACTION" = set-mail ]; then
                  setkey MAIL_MAILER smtp; setkey MAIL_HOST smtp-relay.brevo.com; setkey MAIL_PORT 587
                  setkey MAIL_USERNAME "$M_USER"; setkey MAIL_PASSWORD "$M_PASS"
                  setkey MAIL_FROM_ADDRESS noreply@jadidaring.com; setkey MAIL_FROM_NAME '"Jadidaring"'
                else setkey GOOGLE_CLIENT_ID "$G_ID"; setkey GOOGLE_CLIENT_SECRET "$G_SECRET"; fi
                ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                docker exec singlepage-app php artisan config:clear --no-ansi
                docker exec singlepage-app php artisan cache:clear --no-ansi || true
                grep -E '^(GA4_MEASUREMENT_ID|GOOGLE_CLIENT_ID|GITHUB_CLIENT_ID|TELEGRAM_BOT_USERNAME|MAIL_MAILER|MAIL_HOST|MAIL_PORT|MAIL_FROM_ADDRESS)=' .env | sed -E 's/=(.{12}).*/=\1…/'
                grep -c '^\(GOOGLE_CLIENT_SECRET\|GITHUB_CLIENT_SECRET\|TELEGRAM_BOT_TOKEN\|MAIL_PASSWORD\)=.\+' .env || true
                ;;
              mail-test)
                echo "server outbound IPv4: $(curl -4 -s --max-time 8 https://api.ipify.org)"
                docker exec -e TO="$VALUE" singlepage-app php artisan mail:test --no-ansi
                ;;
              backfill-email-normalized)
                docker exec singlepage-app php artisan users:backfill-email-normalized --no-ansi
                ;;
              merge-langit-dry)
                docker exec singlepage-app php artisan games:merge-rooms langitbersama "$VALUE" --no-ansi
                ;;
              merge-langit)
                docker exec singlepage-app php artisan games:merge-rooms langitbersama "$VALUE" --apply --no-ansi
                ;;
              delete-test-user)
                docker exec singlepage-app php artisan users:delete-test "$VALUE" --force --no-ansi
                ;;
            esac
