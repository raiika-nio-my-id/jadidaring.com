name: Server ops (env keys, test-user cleanup)

# Manual only. Whitelisted actions; secret values come from repo secrets and are never echoed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action
        required: true
        type: choice
        options: [set-ga4, set-google-stats, set-google-oauth, set-github-oauth, set-telegram, set-telegram-oidc, set-mail, mail-test, mail-diag, set-contact-notify, delete-test-user, delete-user, backfill-email-normalized, merge-langit-dry, merge-langit, refresh-popular, diagnose, remove-old-skeleton, news-api-check, diagnose-rename, db-counts, set-deploy-repo, session-diag, purge-clients-dry, purge-clients, list-backups, delete-backups, set-app-url, import-andika-page]
      value:
        description: "set-ga4: measurement id (G-XXXX). set-google-stats: optional Search Console site (sc-domain:jadidaring.com or https://jadidaring.com/). set-contact-notify/mail-test: email. delete-test-user: username (tmp + digits only)"
        required: false
        type: string

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          ACTION: ${{ inputs.action }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$ACTION" in
            set-ga4) [[ "$VALUE" =~ ^G-[A-Z0-9]{4,20}$ ]] || { echo "bad GA4 id"; exit 1; } ;;
            merge-langit-dry|merge-langit) [[ "$VALUE" =~ ^[A-Z0-9]{4,12}$ ]] || { echo "room code required"; exit 1; } ;;
            mail-test|set-contact-notify) [[ "$VALUE" =~ ^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}$ ]] || { echo "bad email"; exit 1; } ;;
            delete-test-user) [[ "$VALUE" =~ ^tmp[0-9]{3,20}$ ]] || { echo "username must match tmp<digits>"; exit 1; } ;;
            delete-user) [[ "$VALUE" =~ ^[a-z0-9_.-]{3,32}$ ]] || { echo "bad username"; exit 1; } ;;
            set-google-stats) [[ -z "$VALUE" || "$VALUE" =~ ^sc-domain:[a-z0-9.-]+$ || "$VALUE" =~ ^https://[a-z0-9.-]+/$ ]] || { echo "bad Search Console site"; exit 1; } ;;
          esac
      - name: Prepare Google stats key
        if: inputs.action == 'set-google-stats'
        env:
          PROP_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SA_JSON: ${{ secrets.GOOGLE_STATS_SA_JSON }}
        run: |
          set -euo pipefail
          [[ "$PROP_ID" =~ ^[0-9]{6,15}$ ]] || { echo "secret GA4_PROPERTY_ID missing or not numeric"; exit 1; }
          printf '%s' "$SA_JSON" | jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | contains("PRIVATE KEY"))' >/dev/null 2>&1 \
            || { echo "secret GOOGLE_STATS_SA_JSON missing or not a service account JSON key"; exit 1; }
          b64="$(printf '%s' "$SA_JSON" | jq -c . | base64 -w0)"
          echo "::add-mask::$b64"
          echo "SA_B64=$b64" >> "$GITHUB_ENV"
          echo "key and property id look valid"
      - name: Run on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ACTION: ${{ inputs.action }}
          VALUE: ${{ inputs.value }}
          G_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TG_USER: ${{ secrets.TG_BOT_USERNAME }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OIDC_ID: ${{ secrets.TG_OIDC_CLIENT_ID }}
          TG_OIDC_SECRET: ${{ secrets.TG_OIDC_CLIENT_SECRET }}
          M_USER: ${{ secrets.MAIL_USERNAME }}
          M_PASS: ${{ secrets.MAIL_PASSWORD }}
          GS_PROP: ${{ secrets.GA4_PROPERTY_ID }}
          GS_KEY: ${{ env.SA_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,ACTION,VALUE,G_ID,G_SECRET,GH_ID,GH_SECRET,TG_USER,TG_TOKEN,TG_OIDC_ID,TG_OIDC_SECRET,M_USER,M_PASS,GS_PROP,GS_KEY
          script: |
            set -euo pipefail
            # Diagnostics (lengths / existence only, never values).
            echo "deploy path len=${#DEPLOY_PATH} dir=$([ -d "${DEPLOY_PATH:-/nonexistent}" ] && echo ok || echo missing) tg_oidc id_len=${#TG_OIDC_ID} secret_len=${#TG_OIDC_SECRET}"
            APP_DIR="${DEPLOY_PATH:-/var/www/jadidaring.com}"
            cd "$APP_DIR"
            setkey() {
              # Rewrite in place (same inode) so the bind-mounted .env stays valid.
              local k="$1" v="$2" tmp; tmp="$(mktemp)"
              { grep -v "^${k}=" .env || true; printf '%s=%s\n' "$k" "$v"; } > "$tmp"
              cat "$tmp" > .env; rm -f "$tmp"
            }
            case "$ACTION" in
              diagnose)
                # Read-only: paths, compose labels and mounts, git origin (credentials masked).
                echo "== ls /var/www"; ls -la /var/www/
                for d in /var/www/singlepage /var/www/singlepage-release /var/www/jadidaring.com-release; do
                  if [ -e "$d" ]; then echo "== find $d (depth 4, max 60)"; find "$d" -maxdepth 4 | head -60; echo "entries: $(find "$d" | wc -l)"; fi
                done
                echo "== app dir $(pwd)"; ls -la | head -60
                echo "== git"; git rev-parse --short HEAD || true; git status --short | head -20 || true
                git config --get remote.origin.url | sed -E 's#://[^@/]+@#://***@#' || true
                echo "== containers"
                docker ps -a --filter name=singlepage --filter name=jadidaring --format '{{.Names}}|{{.Status}}|{{.Image}}'
                for c in $(docker ps -a --filter name=singlepage --filter name=jadidaring --format '{{.Names}}'); do
                  docker inspect "$c" --format '{{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} wd={{index .Config.Labels "com.docker.compose.project.working_dir"}} files={{index .Config.Labels "com.docker.compose.project.config_files"}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}-{{end}} restarts={{.RestartCount}} started={{.State.StartedAt}}'
                  docker inspect "$c" --format '{{range .Mounts}}  {{.Type}} {{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
                done
                echo "== compose projects"; docker compose version || true; docker compose ls -a || true
                echo "== realtime log tail"; docker logs --tail 15 jadidaring-realtime 2>&1 || true
                ;;
              diagnose-rename)
                # Read-only inventory for the singlepage -> jadidaring Docker rename.
                echo "== volumes (project label)"; docker volume ls --filter label=com.docker.compose.project=singlepage; docker volume ls --filter label=com.docker.compose.project=jadidaring
                echo "== volumes named *singlepage*"; docker volume ls --format '{{.Name}}' | grep -i singlepage || echo none
                echo "== per-container volumes/networks/ports"
                for c in $(docker ps -a --filter label=com.docker.compose.project=singlepage --format '{{.Names}}') $(docker ps -a --filter label=com.docker.compose.project=jadidaring --format '{{.Names}}'); do
                  docker inspect "$c" --format '{{.Name}} image={{.Config.Image}} restart={{.HostConfig.RestartPolicy.Name}} ports={{json .HostConfig.PortBindings}} nets={{range $k,$v := .NetworkSettings.Networks}}{{$k}}(aliases={{join $v.Aliases ","}}) {{end}} volumes={{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}->{{.Destination}} {{end}}{{end}}'
                done
                echo "== networks of project"; docker network ls --filter label=com.docker.compose.project=singlepage
                echo "== shared-services members"; docker network inspect shared-services --format '{{range .Containers}}{{.Name}} {{end}}'
                echo "== images"; docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -iE '^(singlepage|jadidaring)' || true
                echo "== proxy manager containers (read-only)"
                for c in $(docker ps --format '{{.Names}} {{.Image}}' | awk '/nginx-proxy-manager|npm|proxy/ {print $1}'); do
                  docker inspect "$c" --format '{{.Name}} image={{.Config.Image}} netmode={{.HostConfig.NetworkMode}} nets={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
                  docker exec "$c" sh -c 'for f in $(grep -l "jadidaring" /data/nginx/proxy_host/*.conf 2>/dev/null); do echo "-- $f"; grep -hE "server_name|set .server|set .port|set .forward_scheme|proxy_pass|location" "$f"; done' 2>/dev/null || echo "(could not read proxy_host confs)"
                done
                echo "== .env keys mentioning singlepage (keys only)"; grep -iE '=.*singlepage' .env | cut -d= -f1 || echo none
                echo "== .env DB_HOST/DB_DATABASE (not secret)"; grep -E '^(DB_HOST|DB_DATABASE|DB_CONNECTION|REDIS_HOST|CACHE_STORE|SESSION_DRIVER|QUEUE_CONNECTION)=' .env || true
                echo "== storage size"; du -sh storage 2>/dev/null || true; df -h /var/www | tail -1
                ;;
              db-counts)
                # Read-only: row count per table (for before/after comparisons).
                app_c="$(docker ps --format '{{.Names}}' | grep -E '^(jadidaring|singlepage)-app$' | head -1)"
                echo "counting via $app_c"
                docker exec "$app_c" php artisan tinker --no-ansi --execute='foreach (Illuminate\Support\Facades\DB::select("SHOW TABLES") as $r) { $t = array_values((array) $r)[0]; echo $t, " ", Illuminate\Support\Facades\DB::table($t)->count(), PHP_EOL; }' | grep -v OPcache | sort
                ;;
              set-deploy-repo)
                # GITHUB_DEPLOY_REPO is informational (not read by the app): point it at the renamed repo.
                cur="$(grep -E '^GITHUB_DEPLOY_REPO=' .env | tail -1 | cut -d= -f2- || true)"
                echo "before: GITHUB_DEPLOY_REPO=${cur:-<unset>}"
                new="$(printf '%s' "$cur" | sed -E 's#raiika-nio-my-id/singlepage(\.git)?#raiika-nio-my-id/jadidaring.com\1#')"
                if [ -n "$cur" ] && [ "$new" != "$cur" ]; then
                  cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                  setkey GITHUB_DEPLOY_REPO "$new"
                  ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                fi
                echo "after:  $(grep -E '^GITHUB_DEPLOY_REPO=' .env | tail -1 || echo '<unset>')"
                ;;
              news-api-check)
                # Authenticated read-only GET with the key from .env; prints status and size only, never the key.
                k="$(grep -E '^ADMIN_API_SECRET=' .env | tail -1 | cut -d= -f2- | tr -d "\"'[:space:]")"
                [ -n "$k" ] || { echo "ADMIN_API_SECRET not set in .env"; exit 1; }
                for path in news/articles news/topics; do
                  code=$(curl -sS --max-time 20 -o /tmp/jd-news-check.json -w '%{http_code}' -H "Accept: application/json" -H "X-Admin-Api-Key: $k" "https://jadidaring.com/api/admin/$path" || echo 000)
                  echo "GET https://jadidaring.com/api/admin/$path (with key): HTTP $code, $(wc -c < /tmp/jd-news-check.json) bytes"
                  [ "$path" = news/topics ] && echo "topic slugs: $(grep -o '"slug":"[a-z0-9-]*"' /tmp/jd-news-check.json | cut -d'"' -f4 | tr '\n' ' ')"
                done
                rm -f /tmp/jd-news-check.json; unset k
                ;;
              remove-old-skeleton)
                # Removes /var/www/singlepage only if it is the realtime skeleton left by
                # the post-rename deploy (realtime/incoming empty + realtime/bin/jd-realtime)
                # and no container mounts anything under it. Backup first.
                OLD=/var/www/singlepage
                [ -d "$OLD" ] || { echo "$OLD absent, nothing to do"; exit 0; }
                [ "$(readlink -f "$OLD")" != "$(readlink -f "$APP_DIR")" ] || { echo "refusing: $OLD is the app dir"; exit 1; }
                extra="$(cd "$OLD" && find . -mindepth 1 | sort | grep -vxF -e ./realtime -e ./realtime/incoming -e ./realtime/bin -e ./realtime/bin/jd-realtime || true)"
                [ -z "$extra" ] || { echo "refusing: unexpected entries:"; echo "$extra"; exit 1; }
                for c in $(docker ps -aq); do
                  if docker inspect "$c" --format '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}' | grep -q "^$OLD\(/\|$\)"; then
                    echo "refusing: container $(docker inspect -f '{{.Name}}' "$c") still mounts $OLD"; exit 1
                  fi
                done
                mkdir -p storage/backups
                bk="storage/backups/old-singlepage-skeleton-$(date +%Y%m%d-%H%M%S).tgz"
                tar -czf "$bk" -C /var/www singlepage && tar -tzf "$bk" >/dev/null
                echo "backup ok: $bk ($(tar -tzf "$bk" | wc -l) entries)"
                rm -rf "$OLD"
                echo "removed $OLD"; ls -la /var/www/
                ;;
              set-google-stats)
                [ -n "$GS_PROP" ] && [ -n "$GS_KEY" ] || { echo "missing GA4_PROPERTY_ID or key"; exit 1; }
                cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                setkey GA4_PROPERTY_ID "$GS_PROP"
                setkey GOOGLE_STATS_SA_JSON_B64 "$GS_KEY"
                if [ -n "$VALUE" ]; then setkey GSC_SITE_URL "$VALUE"; fi
                ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                docker exec jadidaring-app php artisan config:clear --no-ansi
                docker exec jadidaring-app php artisan cache:clear --no-ansi || true
                # Names only, never values.
                for k in GA4_PROPERTY_ID GOOGLE_STATS_SA_JSON_B64 GSC_SITE_URL; do
                  if grep -q "^${k}=.\+" .env; then echo "$k: set"; else echo "$k: not set (default)"; fi
                done
                ;;
              set-ga4|set-google-oauth|set-github-oauth|set-telegram|set-telegram-oidc|set-mail)
                cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                if [ "$ACTION" = set-ga4 ]; then setkey GA4_MEASUREMENT_ID "$VALUE"
                elif [ "$ACTION" = set-github-oauth ]; then setkey GITHUB_CLIENT_ID "$GH_ID"; setkey GITHUB_CLIENT_SECRET "$GH_SECRET"
                elif [ "$ACTION" = set-telegram ]; then setkey TELEGRAM_BOT_USERNAME "$TG_USER"; setkey TELEGRAM_BOT_TOKEN "$TG_TOKEN"
                elif [ "$ACTION" = set-telegram-oidc ]; then
                  [[ "$TG_OIDC_ID" =~ ^[0-9]{4,20}$ ]] && [ -n "$TG_OIDC_SECRET" ] || { echo "secrets TG_OIDC_CLIENT_ID (numeric) / TG_OIDC_CLIENT_SECRET missing"; exit 1; }
                  setkey TELEGRAM_CLIENT_ID "$TG_OIDC_ID"; setkey TELEGRAM_CLIENT_SECRET "$TG_OIDC_SECRET"
                elif [ "$ACTION" = set-mail ]; then
                  setkey MAIL_MAILER smtp; setkey MAIL_HOST smtp-relay.brevo.com; setkey MAIL_PORT 587
                  setkey MAIL_USERNAME "$M_USER"; setkey MAIL_PASSWORD "$M_PASS"
                  setkey MAIL_FROM_ADDRESS noreply@jadidaring.com; setkey MAIL_FROM_NAME '"Jadidaring"'
                else setkey GOOGLE_CLIENT_ID "$G_ID"; setkey GOOGLE_CLIENT_SECRET "$G_SECRET"; fi
                ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                docker exec jadidaring-app php artisan config:clear --no-ansi
                docker exec jadidaring-app php artisan cache:clear --no-ansi || true
                grep -E '^(GA4_MEASUREMENT_ID|GOOGLE_CLIENT_ID|GITHUB_CLIENT_ID|TELEGRAM_BOT_USERNAME|TELEGRAM_CLIENT_ID|MAIL_MAILER|MAIL_HOST|MAIL_PORT|MAIL_FROM_ADDRESS)=' .env | sed -E 's/=(.{12}).*/=\1…/'
                grep -c '^\(GOOGLE_CLIENT_SECRET\|GITHUB_CLIENT_SECRET\|TELEGRAM_BOT_TOKEN\|TELEGRAM_CLIENT_SECRET\|MAIL_PASSWORD\)=.\+' .env || true
                ;;
              mail-test)
                echo "server outbound IPv4: $(curl -4 -s --max-time 8 https://api.ipify.org)"
                docker exec -e TO="$VALUE" jadidaring-app php artisan mail:test --no-ansi
                ;;
              set-contact-notify)
                # Recipient for /kontak notification mail. Written only to the server .env, never committed.
                cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
                setkey CONTACT_NOTIFY_TO "$VALUE"
                ls -t .env.bak-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                docker exec jadidaring-app php artisan config:clear --no-ansi
                docker exec jadidaring-app php artisan config:cache --no-ansi
                domain="${VALUE##*@}"
                echo "CONTACT_NOTIFY_TO: set (@${domain})"
                docker exec jadidaring-app php artisan tinker --no-ansi --execute='echo "config valid=", filter_var(config("mail.contact_notify_to"), FILTER_VALIDATE_EMAIL) ? "yes" : "no", PHP_EOL;' 2>&1 | grep -v OPcache || true
                ;;
              mail-diag)
                # Read-only: mailer config (never username/password/url values) and recent mail log lines.
                echo "== .env mail keys (no secrets)"
                grep -E '^(MAIL_MAILER|MAIL_HOST|MAIL_PORT|MAIL_FROM_ADDRESS|MAIL_FROM_NAME|MAIL_SCHEME|MAIL_EHLO_DOMAIN)=' .env || true
                for k in MAIL_USERNAME MAIL_PASSWORD MAIL_URL; do
                  val="$(grep -E "^${k}=" .env | tail -1 | cut -d= -f2- || true)"
                  if [ -n "$val" ]; then echo "$k: set len=${#val}"; else echo "$k: empty or unset"; fi
                done
                echo "MAIL_ key count: $(grep -c '^MAIL_' .env || true)"
                echo "== config cache"
                docker exec jadidaring-app sh -c 'if [ -f bootstrap/cache/config.php ]; then echo cached; else echo not-cached; fi'
                echo "== runtime config (no secrets)"
                docker exec jadidaring-app php artisan tinker --no-ansi --execute='echo "default=", config("mail.default"), PHP_EOL, "host=", config("mail.mailers.smtp.host"), PHP_EOL, "port=", config("mail.mailers.smtp.port"), PHP_EOL, "from=", config("mail.from.address"), PHP_EOL, "from_name=", config("mail.from.name"), PHP_EOL, "user_set=", (config("mail.mailers.smtp.username") ? "yes" : "no"), PHP_EOL, "pass_set=", (config("mail.mailers.smtp.password") ? "yes" : "no"), PHP_EOL;' 2>&1 | grep -v OPcache || true
                echo "== log files"
                docker exec jadidaring-app sh -c 'ls -la storage/logs' || true
                echo "== recent mail-related log lines (redacted, last 80)"
                docker exec jadidaring-app sh -c 'tail -n 12000 storage/logs/laravel.log 2>/dev/null | grep -iE "Gagal mengirim email|JADIDARING|Tes JD Bot|mailer=|smtp-relay|Mailer|TransportException|Failed to authenticate|Connection could not be established|Symfony.Component.Mailer" | sed -E "s/xsmtpsib-[A-Za-z0-9]+/[redacted]/g; s/(password|passwd|pwd|secret|token|authorization)=[^[:space:]]+/\1=[redacted]/Ig" | cut -c1-400 | tail -n 80' || true
                ;;
              backfill-email-normalized)
                docker exec jadidaring-app php artisan users:backfill-email-normalized --no-ansi
                ;;
              refresh-popular)
                docker exec jadidaring-app php artisan stats:refresh-popular --no-ansi
                ;;
              merge-langit-dry)
                docker exec jadidaring-app php artisan games:merge-rooms langitbersama "$VALUE" --no-ansi
                ;;
              merge-langit)
                docker exec jadidaring-app php artisan games:merge-rooms langitbersama "$VALUE" --apply --no-ansi
                ;;
              purge-clients-dry)
                docker exec jadidaring-app php artisan users:purge-clients --no-ansi
                ;;
              purge-clients)
                [ "$VALUE" = "CONFIRM" ] || { echo "value must be CONFIRM"; exit 1; }
                docker exec jadidaring-app php artisan users:purge-clients --force --no-ansi
                ;;
              list-backups|delete-backups)
                # Only this app's backup folders. Never other hosts, images, containers or databases.
                echo "== df before"; df -h / | tail -1
                for d in storage/backups storage/app/backups; do
                  [ -d "$d" ] || continue
                  echo "== $d ($(du -sh "$d" | cut -f1))"
                  find "$d" -mindepth 1 -maxdepth 3 -printf '%TY-%Tm-%Td %10s %p\n' | sort | tail -n 80
                done
                if [ "$ACTION" = "delete-backups" ]; then
                  [ "$VALUE" = "CONFIRM" ] || { echo "value must be CONFIRM"; exit 1; }
                  [ -d storage/backups ] && find storage/backups -mindepth 1 -delete
                  # storage/app/backups is written by the app user inside the container
                  docker exec jadidaring-app sh -c 'test -d storage/app/backups && find storage/app/backups -mindepth 1 -delete || true'
                  echo "== after"; du -sh storage/backups storage/app/backups 2>/dev/null || true
                  echo "== df after"; df -h / | tail -1
                fi
                ;;
              import-andika-page)
                # Seeds the andika Custom Page (own host andika.<base>) from resources/pages/andika.html.
                # Idempotent: an existing page (admin edits) is kept unless value=force.
                if [ "$VALUE" = "info" ]; then
                  docker exec jadidaring-app php artisan tinker --no-ansi --execute='$p=App\Models\CompanyProfile::where("subdomain","andika")->first(); echo "created=", $p?->created_at, " updated=", $p?->updated_at, " md5=", md5((string) $p?->html), " ig_old=", substr_count((string) $p?->html, "instagram.com/andikanio"), PHP_EOL;' 2>&1 | grep -v OPcache
                  exit 0
                fi
                if [ "$VALUE" = "patch-ig" ]; then
                  docker exec jadidaring-app php artisan tinker --no-ansi --execute='$p=App\Models\CompanyProfile::where("subdomain","andika")->firstOrFail(); $h=str_replace(["https://www.instagram.com/andikanio/","<small>@andikanio</small>"],["https://www.instagram.com/raiika13/","<small>@raiika13</small>"],(string)$p->html); $p->update(["html"=>$h]); echo "patched ig_new=", substr_count($h,"raiika13"), PHP_EOL;' 2>&1 | grep -v OPcache
                  exit 0
                fi
                f=""; [ "$VALUE" = "force" ] && f="--force"
                docker exec jadidaring-app php artisan pages:import-custom andika resources/pages/andika.html --name="Andika Pradipta Suardi" $f --no-ansi 2>&1 | grep -v OPcache
                docker exec jadidaring-app php artisan tinker --no-ansi --execute='echo "public url=", App\Services\TenantPath::publicUrl("andika"), PHP_EOL;' 2>&1 | grep -v OPcache
                ;;
              set-app-url)
                # Idempotent: APP_URL is always the public host (admin.jadidaring.com is retired). Fixed value, no input.
                want="https://jadidaring.com"
                before="$(grep -E '^APP_URL=' .env | tail -1 | cut -d= -f2- || true)"
                echo "APP_URL before: ${before:-<unset>}"
                if [ "$before" != "$want" ]; then setkey APP_URL "$want"; fi
                echo "APP_URL after: $(grep -E '^APP_URL=' .env | tail -1 | cut -d= -f2-)"
                echo "APP_URL lines: $(grep -c '^APP_URL=' .env)"
                # Other link-related keys still naming the old host (names only; hostnames are not secrets, but print just the key names)
                echo "keys still mentioning admin.jadidaring: $(grep -E '^[A-Z0-9_]+=.*admin\.jadidaring' .env | cut -d= -f1 | tr '\n' ' ')"
                for k in ASSET_URL SESSION_DOMAIN MAIL_FROM_ADDRESS REVERB_HOST; do printf '%s: %s\n' "$k" "$(grep -E "^$k=" .env | tail -1 | cut -d= -f2- | sed -E 's/^(.{0,60}).*/\1/' || true)"; done
                docker exec jadidaring-app php artisan config:cache --no-ansi
                docker exec jadidaring-app php artisan queue:restart --no-ansi >/dev/null 2>&1 || true
                docker exec jadidaring-app php artisan tinker --no-ansi --execute='echo "config app.url=", config("app.url"), PHP_EOL, "url(/)=", url("/"), PHP_EOL, "reset=", route("member.password.reset", ["token" => "TOKEN", "email" => "a@example.com"]), PHP_EOL;' | grep -v OPcache
                docker exec jadidaring-scheduler php artisan tinker --no-ansi --execute='echo "scheduler app.url=", config("app.url"), PHP_EOL;' 2>/dev/null | grep -v OPcache || true
                docker ps --format '{{.Names}} {{.Status}}' | grep -E '^jadidaring-' || true
                ;;
              session-diag)
                # Read-only: effective session config, sessions table stats, php upstream, log lines about sessions/DB errors.
                echo "== upstream"; cat .deploy/nginx-upstream.conf 2>/dev/null || true
                echo "== running app-like containers"; docker ps --format '{{.Names}} {{.Status}}' | grep -E 'jadidaring|singlepage' || true
                echo "== .env SESSION_* / APP_ENV (values are not secret)"; grep -E '^(SESSION_[A-Z_]+|APP_ENV|APP_URL|CACHE_STORE)=' .env || true
                docker exec jadidaring-app php artisan tinker --no-ansi --execute='echo json_encode(["driver"=>config("session.driver"),"lifetime"=>config("session.lifetime"),"expire_on_close"=>config("session.expire_on_close"),"cookie"=>config("session.cookie"),"domain"=>config("session.domain"),"secure"=>config("session.secure"),"same_site"=>config("session.same_site"),"lottery"=>config("session.lottery"),"connection"=>config("session.connection"),"table"=>config("session.table")]), PHP_EOL; $t=time(); echo "php time ", $t, " db now ", json_encode(Illuminate\Support\Facades\DB::select("select UNIX_TIMESTAMP() u, NOW() n, @@session.time_zone tz")), PHP_EOL; echo "sessions ", Illuminate\Support\Facades\DB::table("sessions")->count(), " with user ", Illuminate\Support\Facades\DB::table("sessions")->whereNotNull("user_id")->count(), " min/max last_activity ", json_encode(Illuminate\Support\Facades\DB::table("sessions")->selectRaw("min(last_activity) a, max(last_activity) b")->first()), PHP_EOL; echo json_encode(Illuminate\Support\Facades\DB::select("show create table sessions")[0]), PHP_EOL;' | grep -v OPcache
                echo "== php-fpm pm"; docker exec jadidaring-app sh -c 'grep -hE "^(pm|pm\.max_children)" /usr/local/etc/php-fpm.d/*.conf 2>/dev/null' || true
                echo "== recent log lines (session/SQL/deadlock)"; docker exec jadidaring-app sh -c 'tail -n 4000 storage/logs/laravel.log 2>/dev/null | grep -iE "session|deadlock|SQLSTATE|TokenMismatch" | cut -c1-300 | tail -n 25' || true
                ;;
              delete-test-user)
                docker exec jadidaring-app php artisan users:delete-test "$VALUE" --force --no-ansi
                ;;
              delete-user)
                docker exec jadidaring-app php artisan users:delete-test "$VALUE" --allow-non-test --force --no-ansi
                ;;
            esac
