<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4ecff">
<title>Kamu sedang offline — Jadidaring</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:#f4ecff;color:#1d1530;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.card{max-width:380px;background:#fff;border-radius:28px;padding:36px 28px;box-shadow:0 10px 30px rgba(60,30,120,.12)}
.logo{width:88px;height:88px;border-radius:22px;background:#D4FF3A;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.logo img{width:62px;height:auto}
h1{font-size:1.5rem;margin:0 0 8px}p{margin:0 0 22px;line-height:1.5;color:#51476b}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 28px;background:#1d1530;color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #8a5cf6;outline-offset:3px}
@media (prefers-color-scheme:dark){body{background:#17112b;color:#f4ecff}.card{background:#241b40;box-shadow:none}p{color:#c4b8e6}button{background:#D4FF3A;color:#17112b}}
</style>
</head>
<body>
<main class="card">
<div class="logo"><img src="/marketing/images/logo-mark-light.svg" alt="Jadidaring"></div>
<h1>Kamu sedang offline</h1>
<p>Sepertinya sinyal internetmu hilang. Berita dan game butuh koneksi supaya selalu terbaru. Coba lagi setelah tersambung.</p>
<button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
