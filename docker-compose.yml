# ── Resource budget ────────────────────────────────────────────────────────────
# Server: 1 GB RAM / 1 vCPU, shared with other sites.
# This stack must stay within 50 % of the host: ≤ 512 MB RAM, ≤ 0.50 vCPU.
#
#   Service       RAM    CPU
#   jadidaring   256m   0.25
#   reverb        80m   0.08   (fallback engine for games not yet on Rust)
#   realtime      80m   0.08   (Rust WebSocket fan-out, realtime/)
#   scheduler     64m   0.04
#   nginx         32m   0.05
#   ─────────────────────────
#   Total        512m   0.50
#
# Relies on ~/project/infrastructure (mysql-db on shared-services,
# global-npm / Nginx Proxy Manager on shared-services → forward host "singlepage-nginx":80,
# kept as a network alias of jadidaring-nginx; 127.0.0.1:${APP_PORT} is for deploy health checks).
# Create the network once: docker network create shared-services
# Reverb and realtime are internal (sse, unbuffered). Browsers reach it through nginx on /app (Upgrade must pass the proxy).
# Project name is pinned (the folder name /var/www/jadidaring.com would derive
# "jadidaringcom"). Renamed from the original project "singlepage" in Nov 2026;
# scripts/deploy.sh migrates a host still running the old project once.
# No named volumes: the DB is the external global-mysql, storage is the bind-mounted tree.
name: jadidaring

services:
  jadidaring:
    build: .
    image: jadidaring
    container_name: jadidaring-app
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    volumes:
      - .:/var/www
      - ./docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker-config/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini
      - ./docker-config/php/zz-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-20M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-20M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-Off}
      - BROADCAST_CONNECTION=reverb
      - REALTIME_HOST=jadidaring-realtime:9000
      - REVERB_HOST=jadidaring-reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  reverb:
    build: .
    image: jadidaring
    container_name: jadidaring-reverb
    restart: unless-stopped
    mem_limit: 80m
    memswap_limit: 80m
    cpus: 0.08
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker-config/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-20M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-20M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-Off}
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=jadidaring-reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    depends_on:
      - jadidaring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  # Rust WebSocket fan-out. The binary is built in CI (realtime/) and uploaded to
  # realtime/bin/; no image build on the 1 GB host. APP_KEY comes from .env and
  # all sub-keys are derived from it, so no new secret exists.
  realtime:
    image: alpine:3.20
    container_name: jadidaring-realtime
    restart: unless-stopped
    mem_limit: 80m
    memswap_limit: 80m
    cpus: 0.08
    command: ["/rt/jd-realtime"]
    volumes:
      - ./realtime/bin:/rt:ro
    environment:
      - APP_KEY=${APP_KEY}
    networks:
      - shared-services

  scheduler:
    build: .
    image: jadidaring
    container_name: jadidaring-scheduler
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.04
    user: root
    entrypoint: ["/usr/local/bin/scheduler-entrypoint.sh"]
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker-config/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-20M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-20M}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_MAX_INPUT_TIME=${PHP_MAX_INPUT_TIME:-300}
      - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-Off}
    depends_on:
      - jadidaring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-services

  nginx:
    image: nginx:alpine
    container_name: jadidaring-nginx
    restart: unless-stopped
    labels:
      jadidaring.nginx-config: "microcache-2026-11-19b-nohead"
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.05
    ports:
      # 8080 is used by invoiceku-nginx / global-proxy → invoiceku.test
      - "127.0.0.1:${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jadidaring
      - reverb
      - realtime
    networks:
      shared-services:
        # Nginx Proxy Manager forwards jadidaring.com to "singlepage-nginx":80 by name.
        aliases:
          - singlepage-nginx

networks:
  shared-services:
    external: true
